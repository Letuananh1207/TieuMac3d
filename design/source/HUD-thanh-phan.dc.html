<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HUD C – thành phần và trạng thái</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&amp;family=Lora:wght@700&amp;family=Noto+Serif+SC:wght@700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B5446}a:hover{color:#24323A}
</style>
</helmet>
<div style="width: 844px; height: 520px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #24323A">
  <sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; background: {{col.bg}}">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #24323A; opacity: .8">{{col.label}}</div>

      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px">
        <div style="height: 36px; box-sizing: border-box; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 8px; background: rgba(244,247,246,.82); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.16); border-radius: 999px; box-shadow: 0 4px 14px rgba(36,50,58,.18); font-size: 13px; font-weight: 700"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #D4A64A"></span><span>Văn Uyên Tông <span style="color: #2B5446">· Ngoại Môn</span></span></div>
        <div style="height: 36px; box-sizing: border-box; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 8px; background: rgba(244,247,246,.82); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.16); border-radius: 999px; box-shadow: 0 4px 14px rgba(36,50,58,.18); font-size: 13px; font-weight: 700"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #D4A64A"></span><span>Văn Uyên Tông</span></div>
        <div style="height: 36px; box-sizing: border-box; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 8px; background: rgba(244,247,246,.82); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.16); border-radius: 999px; box-shadow: 0 4px 14px rgba(36,50,58,.18); font-size: 13px; font-weight: 700; white-space: nowrap"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #D4A64A"></span><span>Văn Uyên Tông <span style="color: #2B5446">· Linh Dược Viên</span></span></div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center">
        <button type="button" style="height: 44px; box-sizing: border-box; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 700; color: #24323A; background: rgba(244,247,246,.82); border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.16); border-radius: 999px; box-shadow: 0 4px 14px rgba(36,50,58,.18)">Góc nhìn: gần</button>
        <button type="button" style="height: 44px; box-sizing: border-box; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 700; color: #24323A; background: rgba(244,247,246,.82); border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.16); border-radius: 999px; box-shadow: 0 4px 14px rgba(36,50,58,.18); white-space: nowrap">Góc nhìn: cả sân</button>
      </div>

      <div style="display: flex; gap: 12px; align-items: center">
        <div style="height: 24px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: rgba(244,247,246,.88); border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.16); border-radius: 999px; font-size: 12px; font-weight: 700"><span aria-hidden="true" style="width: 4px; height: 4px; border-radius: 50%; background: #D4A64A"></span>Tuấn Anh</div>
        <div style="font-family: ui-monospace, monospace; font-size: 11px; background: rgba(244,247,246,.8); padding: 2px 6px; border-radius: 6px">60 fps</div>
        <div style="font-size: 11px; opacity: .8">← chỉ ở chế độ gỡ lỗi</div>
      </div>

      <div style="display: flex; gap: 24px; align-items: center">
        <div aria-hidden="true" style="width: 110px; height: 110px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.2); background: rgba(244,247,246,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(43,84,70,.85); border: 1px solid rgba(255,255,255,.9)"></div>
          <span style="font-size: 12px; font-weight: 700">kéo để đi</span>
        </div>
        <div aria-hidden="true" style="position: relative; width: 120px; height: 120px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(255,255,255,.95); outline: 1px solid rgba(36,50,58,.22); background: rgba(244,247,246,.38)">
          <div style="position: absolute; left: 57px; top: 57px; width: 6px; height: 6px; border-radius: 50%; background: rgba(36,50,58,.35)"></div>
          <div style="position: absolute; left: 62px; top: 22px; width: 48px; height: 48px; border-radius: 50%; background: #2B5446; border: 1px solid rgba(255,255,255,.95); box-shadow: 0 4px 12px rgba(43,84,70,.4)"></div>
        </div>
        <div style="font-size: 11px; line-height: 1.5; opacity: .85">gợi ý (chưa chạm)<br>→ đang giữ: vòng hiện ở chỗ ngón chạm</div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return { cols: [
  { label: 'Trên trời sáng', bg: '#A9C8E8' },
  { label: 'Trên tường vôi trắng', bg: '#EEE9DF' }
] };
}
}
</script>
</body>
</html>
