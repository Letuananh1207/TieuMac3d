<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thẻ học bộ thủ – dọc – 氵 lần đầu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&amp;family=Lora:wght@700&amp;family=Noto+Serif+SC:wght@700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B5446}a:hover{color:#24323A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #E9EEEC; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #24323A">
  <svg aria-hidden="true" width="390" height="300" viewBox="0 0 390 300" style="position: absolute; left: 0; bottom: 0">
    <path d="M0 150 L40 110 L78 132 L130 70 L170 112 L205 92 L250 128 L300 64 L350 118 L390 96 L390 300 L0 300 Z" fill="#D3DDDA"></path>
    <path d="M0 210 L50 172 L96 196 L150 150 L200 190 L240 168 L292 206 L340 176 L390 200 L390 300 L0 300 Z" fill="#BFCFCB"></path>
  </svg>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px; border-bottom: 1px dashed rgba(31,22,16,.3); background: repeating-linear-gradient(135deg, rgba(31,22,16,.06) 0 6px, transparent 6px 12px)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 34px; border-top: 1px dashed rgba(31,22,16,.3); background: repeating-linear-gradient(135deg, rgba(31,22,16,.06) 0 6px, transparent 6px 12px)"></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 59px; bottom: 50px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-align: center">{{eyebrow}}</div>

    <main style="position: relative; flex: 1 1 auto; box-sizing: border-box; padding: 22px 22px 20px; background: rgba(244,247,246,.86); border: 1px solid rgba(36,50,58,.16); border-radius: 16px; box-shadow: 0 12px 32px rgba(36,50,58,.22); display: flex; flex-direction: column; gap: 14px">
      <sc-if value="{{learned}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; right: 14px; top: 14px; height: 26px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 1px solid #2B5446; border-radius: 999px; font-size: 12px; font-weight: 700; color: #2B5446"><span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 50%; background: #D4A64A"></span>Đã học</div>
      </sc-if>
      <div style="display: flex; align-items: center; justify-content: center; gap: 18px">
        <div lang="zh" style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 120px; line-height: 1; color: #2B5446">{{radical}}</div>
        <sc-if value="{{twoForms}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
            <div style="font-size: 12px; font-weight: 700">dạng đủ</div>
            <div lang="zh" style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 56px; line-height: 1.1">{{full}}</div>
          </div>
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="font-family: 'Lora', Georgia, serif; font-weight: 700; font-size: 22px; color: #A8322A">{{pinyin}}</div>
        <div style="font-size: 18px; font-weight: 700">{{name}}</div>
      </div>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; height: 1px; background: rgba(36,50,58,.2)"></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #D4A64A"></span><span style="flex: 1; height: 1px; background: rgba(36,50,58,.2)"></span></div>

      <div style="font-size: 15px; font-weight: 700; color: #2B5446">Từ hình đến chữ</div>
      <div style="display: flex; align-items: center; justify-content: space-between">
          <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <div style="width: 78px; height: 78px; box-sizing: border-box; border-radius: 12px; background: #F2EADA; border: 1px solid rgba(36,50,58,.16); display: flex; align-items: center; justify-content: center"><svg role="img" aria-label="Hình vẽ dòng nước chảy" width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#24323A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M30 6c-6 8 6 14 0 22s6 14 0 26"></path><path d="M14 16c-3 4 3 7 0 11"></path><path d="M46 16c-3 4 3 7 0 11"></path><path d="M14 36c-3 4 3 7 0 11"></path><path d="M46 36c-3 4 3 7 0 11"></path></svg></div>
            <figcaption style="font-size: 12px">hình dòng nước</figcaption>
          </figure>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B5446" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
          <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <div style="width: 78px; height: 78px; box-sizing: border-box; border-radius: 12px; background: #F2EADA; border: 1px solid rgba(36,50,58,.16); display: flex; align-items: center; justify-content: center"><svg role="img" aria-label="Chữ triện 水" width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#24323A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M30 6v48"></path><path d="M14 14c4 6 4 14 10 18"></path><path d="M46 14c-4 6-4 14-10 18"></path><path d="M16 50c4-8 8-12 12-14"></path><path d="M44 50c-4-8-8-12-12-14"></path></svg></div>
            <figcaption style="font-size: 12px">chữ triện</figcaption>
          </figure>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B5446" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
          <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <div style="width: 78px; height: 78px; box-sizing: border-box; border-radius: 12px; background: #F2EADA; border: 1px solid rgba(36,50,58,.16); display: flex; align-items: center; justify-content: center"><span lang="zh" style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 46px; line-height: 1; color: #2B5446">水</span></div>
            <figcaption style="font-size: 12px">chữ khải</figcaption>
          </figure>
      </div>

      <dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; row-gap: 12px; font-size: 15px; line-height: 1.45">
        <dt style="font-weight: 700; color: #2B5446">Nét</dt><dd style="margin: 0">{{strokes}}</dd>
        <dt style="font-weight: 700; color: #2B5446">Chữ có bộ này</dt>
        <dd style="margin: 0; display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{examples}}" as="ex" hint-placeholder-count="3"><div><span lang="zh" style="font-family: 'Noto Serif SC', serif; font-size: 20px">{{ex.han}}</span> {{ex.py}} · {{ex.vi}}</div></sc-for>
        </dd>
      </dl>
    </main>

    <button type="button" style="flex: 0 0 auto; height: 52px; font: inherit; font-weight: 700; font-size: 15px; border-radius: 12px; border: 0; background: #2B5446; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), 0 4px 12px rgba(43,84,70,.3)">
      <sc-if value="{{learned}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></sc-if>
      <sc-if value="{{first}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
      {{action}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  return {
    eyebrow: 'Bộ thủ · Rừng trúc', learned: false, first: true, twoForms: true,
    radical: '氵', full: '水', pinyin: 'shuǐ', name: 'thuỷ — nước',
    strokes: '4 (水) · 3 (氵)',
    examples: [ { han: '河', py: 'hé', vi: 'sông' }, { han: '江', py: 'jiāng', vi: 'sông lớn' }, { han: '海', py: 'hǎi', vi: 'biển' } ],
    action: 'Đã học · khắc vào bia'
  };
}
}
</script>
</body>
</html>
