<title>Bản đồ truyền tống</title>
<!-- font đóng gói của web/ (cần đã chạy npm install trong web/) — không cần mạng -->

<body>
<canvas id="c" width="2048" height="1152"></canvas>
<script>
// Bản đồ truyền tống — thế giới chia VÙNG (design 2026-11-14.6; .7: chỉ chữ Việt, bỏ đường toả về nhà). Nền là bản đồ các miền (Tây Vực, Yên Vân, Kinh Kỳ, Trung
// Nguyên, Ba Thục, Ngô Việt, Đông Hải; còn Mạc Bắc, Lĩnh Nam, Điền Nam chưa khám phá). Mỗi NƠI đi được (7 cảnh + Nhà của ta) chỉ là
// một điểm nhỏ trong vùng của nó. Toạ độ theo ảnh 2048 × 1152 (gốc trên trái).
// V-54 (2026-11-15): vẽ đúng thế đất từng cảnh (design/scene/<mã>.json) — Khởi Nguyên Trấn trên đỉnh dãy núi Ba Thục góc
// trái dưới, quanh là biển mây (cloudSea); Nhà của ta đảo nhỏ nổi trên biển mây, góc trái dưới của trấn; Trúc Lâm thung lũng
// đồng bằng dưới chân núi (đồi thấp, không giữa dãy núi); Nhạn Môn Quan trên sống núi; Tử Cấm Thành đồng bằng kinh thành;
// Yên Vũ Lâu sông nước; Bồng Lai Đảo đảo giữa biển, mây quanh; Đôn Hoàng Lộ sa mạc. Biểu tượng nhỏ lại 60 % (S 0,6 → 0,36).
// V-59 (2026-11-15): đường bộ nối các cặp cổng đi bộ (LAND_ROUTES — quan đạo / đường mòn / đường cát theo miền), dừng trước
// khung biểu tượng + nhãn hai đầu (clearOf); Yên Vũ Lâu ↔ Bồng Lai giữ đường thuyền.
// V-107 (2026-11-18, thế giới bộ 2 — phiếu docs/phieu_thiet_ke/2026-11-17-concept-the-gioi-moi.md): tên mới, giữ mã + vị trí;
// biểu tượng mới: Tháp Sáo Trúc (rung-truc), Cây Đèn Trăm Tầng bên sông (giang-nam), Lò Thuốc Tiên trên nấm khổng lồ
// (tu-cam-thanh), Cung Vỏ Sò dưới làn nước — đảo cũ thành vùng nước nông (bong-lai), đình bát giác cột son + tùng cổ trên
// cột đá (truong-thanh — KHÔNG tổ hạc, người dùng 2026-11-18), Cổng Thành Vùi Cát + đầu lạc đà đá (to-lua). Bỏ Trường Thành
// ở mép trên và tên miền Hán Việt in trên giấy (REGIONS chỉ còn để tô màu miền); mép trên / dưới là sương "chưa khám phá".
// Xuất ảnh: ?xuat → dataURL PNG ghi vào <textarea id="out"> (hoặc gọi window.ready qua DevTools).
const W = 2048, H = 1152;
const PAPER = '#F2EADA', INK = '#24323A', JADE = '#2B5446', SON = '#A8322A', GOLD = '#C9A13B';
const SEA = '#BFD5D1', SEA_DEEP = '#A9C6C2', COAST = '#6F9590';

// VÙNG: seed = hạt phân vùng (có thể nằm ngoài giấy), lx/ly = chỗ viết tên vùng; wild = chưa khám phá
const REGIONS = [
  { id: 'tay-vuc',      han: '西域', name: 'Tây Vực',      seed: [260, 250],   lx: 230,  ly: 150,  tint: '#EAD7A8' },
  { id: 'yen-van',      han: '燕雲', name: 'Yên Vân',      seed: [920, 270],   lx: 700,  ly: 400,  tint: '#D8DFE2' },
  { id: 'kinh-ky',      han: '京畿', name: 'Kinh Kỳ',      seed: [1470, 300],  lx: 1560, ly: 140,  tint: '#E4D5E6' },
  { id: 'trung-nguyen', han: '中原', name: 'Trung Nguyên', seed: [960, 720],   lx: 1130, ly: 905,  tint: '#D3E2CD' },
  { id: 'ba-thuc',      han: '巴蜀', name: 'Ba Thục',      seed: [280, 760],   lx: 270,  ly: 590,  tint: '#CBD6BD' },
  { id: 'ngo-viet',     han: '吳越', name: 'Ngô Việt',     seed: [1450, 800],  lx: 1420, ly: 1050, tint: '#D6DFE4' },
  { id: 'dien-nam',     han: '滇南', name: 'Điền Nam',     seed: [760, 1330],  lx: 860,  ly: 1122, wild: true },
  { id: 'linh-nam',     han: '嶺南', name: 'Lĩnh Nam',     seed: [1200, 1330], lx: 1290, ly: 1122, wild: true },
  { id: 'mac-bac',      han: '漠北', name: 'Mạc Bắc',      seed: null,         lx: 1260, ly: 44,   wild: true },
  { id: 'dong-hai',     han: '東海', name: 'Đông Hải',     sea: true,          lx: 1850, ly: 1010 }
];
// NƠI (cảnh đi được): x, y = tâm biểu tượng = tâm vùng chạm. de = đế dưới biểu tượng (thế đất của cảnh): không ghi = đế
// giấy · song (sống núi) · nui (đỉnh núi giữa biển mây) · dao (đảo nhỏ nổi trên biển mây); island = đảo trên biển
const PLACES = [
  { id: 'to-lua',       han: '絲路', name: 'Thành Cát Ngủ Quên', x: 330,  y: 290 },
  { id: 'truong-thanh', han: '長城', name: 'Đỉnh Hạc Bay',     x: 930,  y: 235, de: 'song' },
  { id: 'tu-cam-thanh', han: '紫禁', name: 'Rừng Nấm Tiên',    x: 1430, y: 300 },
  { id: 'rung-truc',    han: '竹林', name: 'Thung Trúc Gió Hát', x: 860,  y: 740 },
  { id: 'van-uyen',     han: '起源', name: 'Khởi Nguyên Trấn', x: 440,  y: 800, de: 'nui' },
  { id: 'giang-nam',    han: '江南', name: 'Chợ Đêm Đèn Hoa',  x: 1400, y: 790 },
  { id: 'bong-lai',     han: '蓬萊', name: 'Cung Ngọc Đáy Biển', x: 1880, y: 610, island: true },
  { id: 'nha-ta',       han: '我家', name: 'Nhà của ta',       x: 230,  y: 975, r: 95, de: 'dao' }
];
// vùng chạm quanh biểu tượng: lớn hơn biểu tượng (≥ cỡ ngón tay ở 360 × 640: r 120 → ∅ ≈ 41 px), phủ cả nhãn tên dưới
// biểu tượng. Nhà của ta r 95 riêng (sát Khởi Nguyên Trấn, hai vùng chạm không chồng).
const R = 120;
const S = 0.36;         // cỡ biểu tượng (V-54: 0,6 → 0,36 = 60 %)
const LABEL_VI = 46, LABEL_DY = 46;

function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const rand = rnd(7);

// nhiễu giá trị mượt (ranh giới vùng, bờ biển uốn tự nhiên)
function hash(i, j, s) { let h = (i * 374761393 + j * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function noise(x, y, s) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(i, j, s), b = hash(i + 1, j, s), c = hash(i, j + 1, s), d = hash(i + 1, j + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) { return noise(x, y, s) * 0.6 + noise(x * 2.1, y * 2.1, s + 9) * 0.28 + noise(x * 4.3, y * 4.3, s + 17) * 0.12; }

// bờ đông đại lục, Trường Thành (ranh Mạc Bắc), đảo Bồng Lai
function coastX(y) { return 1690 + 60 * Math.sin(y / 190) + 26 * Math.sin(y / 61 + 1.3) - 70 * Math.exp(-(((y - 690) / 150) ** 2)) + (fbm(0.5, y / 90, 3) - 0.5) * 70; }
function wallY(x) { return 92 + Math.sin(x / 90) * 16 + Math.sin(x / 37) * 5; }
const BL = PLACES.find(p => p.island);
function islandR(a) { return 1 + (fbm(Math.cos(a) * 1.6 + 5, Math.sin(a) * 1.6 + 5, 41) - 0.5) * 0.5; }
function onIsland(x, y) {
  const dx = (x - BL.x) / 130, dy = (y - (BL.y + 15)) / 112, d = Math.hypot(dx, dy);
  return d < islandR(Math.atan2(dy, dx));
}
const RI = id => REGIONS.findIndex(r => r.id === id);
const SEA_ID = -1, BL_REGION = RI('dong-hai');

// ---------- phân vùng: điểm đất thuộc hạt gần nhất (khoảng cách nhiễu); bắc tường = Mạc Bắc ----------
function regionMap() {
  const ids = new Int8Array(W * H).fill(SEA_ID);
  const seeded = REGIONS.map((r, i) => [r, i]).filter(([r]) => r.seed);
  const mb = RI('mac-bac');
  for (let y = 0; y < H; y++) {
    const cx = coastX(y);
    for (let x = 0; x < W; x++) {
      const k = y * W + x;
      if (x < cx) {
        if (y < wallY(x)) { ids[k] = mb; continue; }
        const wx = x + (fbm(x / 170, y / 170, 5) - 0.5) * 220, wy = y + (fbm(x / 170 + 30, y / 170, 6) - 0.5) * 220;
        let best = -1, bd = 1e18;
        for (const [r, i] of seeded) { const d = (wx - r.seed[0]) ** 2 + ((wy - r.seed[1]) * 1.1) ** 2; if (d < bd) { bd = d; best = i; } }
        ids[k] = best;
      } else if (onIsland(x, y)) ids[k] = BL_REGION;
    }
  }
  return ids;
}

function paintLand(g, ids) {
  const img = g.getImageData(0, 0, W, H), px = img.data;
  const hex = h => [1, 3, 5].map(o => parseInt(h.slice(o, o + 2), 16));
  const tint = REGIONS.map(r => r.wild ? [0xEC, 0xE5, 0xD3] : r.sea ? hex('#CFE7E2') : hex(r.tint));
  const br = [0x5B, 0x4A, 0x3A];
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? -9 : ids[y * W + x];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = y * W + x, id = ids[k];
    if (id === SEA_ID) continue;
    const c = tint[id], wild = REGIONS[id].wild;
    let edge = 0, line = false;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = at(x + dx * 2, y + dy * 2); if (n >= 0 && n !== id) line = true; }
    if (!line) for (const [dx, dy] of [[16, 0], [-16, 0], [0, 16], [0, -16], [11, 11], [-11, 11], [11, -11], [-11, -11]]) {
      const n = at(x + dx, y + dy); if (n >= 0 && n !== id) { edge = 1; break; }
    }
    const gr = noise(x / 5, y / 5, 77) > 0.5 ? 3 : 0;
    const hatch = wild && ((x + y) % 22) < 2 ? 10 : 0;
    let r = c[0] - gr - hatch, gg = c[1] - gr - hatch, b = c[2] - gr - hatch;
    if (edge) { r *= 0.94; gg *= 0.94; b *= 0.94; }
    // ranh vùng: nét mực nâu đứt (kiểu ranh giới hành chính trên bản đồ cổ)
    if (line && ((x + y) >> 3) % 3 !== 2) { r = r * 0.3 + br[0] * 0.7; gg = gg * 0.3 + br[1] * 0.7; b = b * 0.3 + br[2] * 0.7; }
    const o = k * 4; px[o] = r; px[o + 1] = gg; px[o + 2] = b; px[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

function paper(g) {
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = `rgba(120,100,70,${0.015 + rand() * 0.02})`;
    g.fillRect(rand() * W, rand() * H, 1 + rand() * 3, 1 + rand() * 2);
  }
}
function vignette(g) {
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  v.addColorStop(0, 'rgba(160,130,90,0)'); v.addColorStop(1, 'rgba(160,130,90,.22)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

function islandPath(g, off, begin = true) {
  if (begin) g.beginPath();
  for (let a = 0; a <= Math.PI * 2 + 0.001; a += 0.02) {
    const rr = islandR(a), x = BL.x + Math.cos(a) * (130 * rr + off), y = BL.y + 15 + Math.sin(a) * (112 * rr + off);
    a ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function sea(g) {
  g.save();
  g.beginPath(); g.moveTo(W, 0); for (let y = 0; y <= H; y += 4) g.lineTo(coastX(y), y); g.lineTo(W, H); g.closePath();
  islandPath(g, 0, false);
  const s = g.createLinearGradient(1500, 0, W, 0); s.addColorStop(0, SEA); s.addColorStop(1, SEA_DEEP);
  g.fillStyle = s; g.fill('evenodd');
  g.lineCap = 'round';
  for (const [off, a] of [[26, 0.55], [58, 0.35], [96, 0.2]]) {
    g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 5; g.setLineDash([60, 34]);
    g.beginPath(); for (let y = 0; y <= H; y += 6) { const x = coastX(y) + off; y ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
    islandPath(g, off); g.stroke();
  }
  g.setLineDash([]);
  g.strokeStyle = COAST; g.lineWidth = 6;
  g.beginPath(); for (let y = 0; y <= H; y += 4) { const x = coastX(y); y ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  islandPath(g, 0); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 5;
  for (const [x, y] of [[1840, 380], [1990, 470], [1800, 1080], [1990, 1110], [1990, 300]]) {
    g.beginPath(); g.arc(x - 18, y, 18, Math.PI * 1.1, Math.PI * 1.9); g.arc(x + 18, y, 18, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  }
  g.restore();
}

// ---------- sông: Hoàng Hà (bắc) và Trường Giang (nam) chảy ra biển đông ----------
function smooth(g, pts) {
  g.beginPath(); g.moveTo(...pts[0]);
  for (let i = 1; i < pts.length - 1; i++) { const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]; g.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
  g.lineTo(...pts[pts.length - 1]);
}
function rivers(g) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const hh = [[30, 470], [180, 500], [330, 455], [520, 505], [700, 470], [860, 520], [1040, 470], [1200, 510], [1360, 465], [1530, 505], [coastX(500) + 4, 500]];
  // Trường Giang chảy ra từ chân dãy núi Ba Thục (dưới biển mây), qua nam đồng bằng ra biển đông
  const tg = [[560, 1000], [740, 1015], [920, 975], [1100, 1020], [1280, 975], [1460, 1010], [coastX(990) + 4, 990]];
  // suối thung lũng Trúc Lâm: từ núi xuống đồng bằng, nhập Trường Giang (cảnh có thác + suối)
  const suoi = [[640, 660], [720, 720], [745, 820], [700, 900], [760, 1000]];
  for (const [pts, w] of [[hh, 18], [tg, 18], [suoi, 9]]) {
    g.strokeStyle = COAST; g.globalAlpha = 0.55; g.lineWidth = w + 8; smooth(g, pts); g.stroke();
    g.globalAlpha = 1; g.strokeStyle = SEA; g.lineWidth = w; smooth(g, pts); g.stroke();
  }
  g.restore();
}

// ---------- thế đất từng cảnh (V-54, theo design/scene/<mã>.json) ----------
// núi: chân (x, by), nửa bề ngang hw, cao h, đỉnh bằng rộng top (chỗ đặt biểu tượng); nửa phải đổ bóng
function mount(g, x, by, hw, h, c1, c2, top = 0) {
  const ax = x - top / 2, bx = x + top / 2, ay = by - h;
  g.fillStyle = c1; g.beginPath(); g.moveTo(x - hw, by);
  g.quadraticCurveTo(x - hw * 0.3, by - h * 0.5, ax, ay); g.lineTo(bx, ay);
  g.quadraticCurveTo(x + hw * 0.3, by - h * 0.5, x + hw, by); g.closePath(); g.fill();
  g.fillStyle = c2; g.beginPath(); g.moveTo(bx, ay);
  g.quadraticCurveTo(x + hw * 0.3, by - h * 0.5, x + hw, by); g.lineTo(x + hw * 0.12, by);
  g.quadraticCurveTo(x + hw * 0.06, by - h * 0.55, bx, ay); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(48,64,58,.28)'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - hw * 0.8, by - h * 0.08); g.quadraticCurveTo(x - hw * 0.3, by - h * 0.5, ax, ay); g.lineTo(bx, ay); g.stroke();
}
// mây: chùm bầu dục trắng, viền dưới xám xanh nhạt (đọc là biển mây khi xếp thành dải)
function puff(g, x, y, w, a = 0.95) {
  g.save(); g.globalAlpha = a;
  g.fillStyle = 'rgba(170,186,190,.55)';
  g.beginPath(); g.ellipse(x, y + w * 0.12, w, w * 0.3, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#FBF9F4';
  for (const [dx, dy, k] of [[0, 0, 1], [-0.55, 0.06, 0.62], [0.55, 0.05, 0.66], [-0.2, -0.16, 0.6], [0.28, -0.14, 0.55]]) {
    g.beginPath(); g.ellipse(x + dx * w, y + dy * w, w * k * 0.62, w * k * 0.3, 0, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}
// Khởi Nguyên Trấn (scene.json: trấn trên đỉnh núi, cloudSea r 420, đảo nổi) — dãy núi Ba Thục góc trái dưới, biển mây
// phủ chân núi; Nhà của ta (nha-ta.json: đảo nhỏ, cloudSea r 220) nổi trên biển mây ở góc trái dưới của trấn
function massif(g) {
  const kn = P('van-uyen'), far = ['#B9C6B4', '#A3B2A1'], mid = ['#9DB09E', '#84998A'], near = ['#8CA393', '#728A7C'];
  g.save();
  for (const [x, by, hw, h] of [[120, 880, 170, 235], [300, 860, 150, 210], [520, 840, 140, 180]]) mount(g, x, by, hw, h, ...far);
  for (const [x, by, hw, h] of [[200, 990, 150, 230], [640, 1000, 150, 200], [40, 1000, 110, 170]]) mount(g, x, by, hw, h, ...mid);
  // đỉnh của trấn: đỉnh bằng, biểu tượng đứng trên
  mount(g, kn.x, 1030, 240, 1030 - (kn.y + 30), ...near, 110);
  // mây vắt ngang sườn núi
  for (const [x, y, w] of [[90, 830, 70], [610, 820, 60], [300, 905, 60]]) puff(g, x, y, w, 0.9);
  g.restore();
}
function cloudSea(g) {
  // dải biển mây phủ chân dãy núi Ba Thục và góc trái dưới (tan dần về đông)
  const r = rnd(31);
  for (let row = 0; row < 4; row++) {
    const y0 = 945 + row * 58;
    for (let x = -30; x < 820; x += 70 + r() * 30) {
      const fade = x < 560 ? 1 : Math.max(0, 1 - (x - 560) / 260);
      if (fade <= 0.05) continue;
      puff(g, x, y0 + (r() - 0.5) * 30 + Math.sin(x / 90) * 10, 70 + r() * 30, 0.9 * fade);
    }
  }
}
// Nhạn Môn Quan (truong-thanh.json: quan ải giữa các đỉnh 22–30 m, biển mây thấp) — sống núi, quan thành ở yên ngựa
function ridge(g) {
  const p = P('truong-thanh'), c = ['#C4BFA8', '#ADA891'], c2 = ['#B3AE96', '#9A957E'];
  g.save();
  for (const [dx, by, hw, h] of [[-250, 330, 110, 150], [230, 330, 120, 160], [-120, 305, 100, 105], [120, 308, 100, 115]]) mount(g, p.x + dx, by, hw, h, ...c);
  mount(g, p.x, p.y + 95, 170, 95 - 30, ...c2, 70);
  g.restore();
}

const placed = [];
function blocked(x, y) {
  for (const p of PLACES) if (Math.abs(x - p.x) < 200 && y > p.y - 120 && y - 60 < p.y + 190) return true;
  if (x < 740 && y > 560) return true;            // dãy núi + biển mây Ba Thục (vẽ riêng)
  if (x > 1000 && x < 1180 && y > 600 && y < 900) return true; // đồi thấp quanh Thung Trúc Gió Hát
  if (x > 1820 && y < 260) return true;           // la bàn
  return placed.some(([px, py]) => Math.hypot(px - x, py - y) < 85);
}
function scatter(g, ids, rid, n, seed, drawFn) {
  const r = rnd(seed), idx = RI(rid); let done = 0;
  for (let t = 0; t < n * 80 && done < n; t++) {
    const x = 40 + r() * (W - 80), y = 40 + r() * (H - 80);
    if (ids[(y | 0) * W + (x | 0)] !== idx || blocked(x, y)) continue;
    let ok = true; for (const [dx, dy] of [[40, 0], [-40, 0], [0, 40], [0, -40]]) { const xx = x + dx | 0, yy = y + dy | 0; if (xx < 0 || yy < 0 || xx >= W || yy >= H || ids[yy * W + xx] !== idx) ok = false; }
    if (!ok) continue;
    drawFn(g, x, y, r); placed.push([x, y]); done++;
  }
}
function peak(g, x, y, s, c1, c2) {

}

// ---------- đường: quan đạo toả từ nhà, đường biển, đường cụt vào vùng chưa khám phá, Trường Thành ----------
const P = id => PLACES.find(p => p.id === id);
function curve(a, b, bend, n = 120) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const c = [mx - (dy / L) * bend, my + (dx / L) * bend], pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; pts.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]); }
  return pts;
}
// bỏ đoạn gần biểu tượng hai đầu (đường dừng trước biểu tượng, không đè hình / chữ)
function trim(pts, d0, d1) {
  const a = pts[0], b = pts[pts.length - 1];
  return pts.filter(q => Math.hypot(q[0] - a[0], q[1] - a[1]) > d0 && Math.hypot(q[0] - b[0], q[1] - b[1]) > d1);
}
function road(g, pts, fade = 1) {
  if (pts.length < 2) return;
  const n = pts.length - 1, cut = Math.round(n * fade);
  const seg = (from, to) => { g.beginPath(); g.moveTo(...pts[from]); for (let i = from + 1; i <= to; i++) g.lineTo(...pts[i]); };
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(138,100,62,.8)'; g.lineWidth = 16; seg(0, cut); g.stroke();
  g.strokeStyle = '#F3E9D2'; g.lineWidth = 7; seg(0, cut); g.stroke();
  if (cut < n) {
    g.setLineDash([14, 12]);
    for (let i = cut; i < n; i++) {
      g.globalAlpha = 0.85 * (1 - (i - cut) / (n - cut));
      g.strokeStyle = 'rgba(138,100,62,1)'; g.lineWidth = 8; seg(i, i + 1); g.stroke();
    }
  }
  g.restore();
}
function seaRoute(g, pts, boat = true) {
  g.save(); g.lineCap = 'round'; g.setLineDash([22, 16]); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(...pts[0]); for (const q of pts.slice(1)) g.lineTo(...q); g.stroke(); g.restore();
  if (!boat) return;
  const [x, y] = pts[Math.floor(pts.length / 2)];
  g.save(); g.fillStyle = '#6B4A30'; g.beginPath(); g.moveTo(x - 26, y); g.lineTo(x + 26, y); g.lineTo(x + 16, y + 12); g.lineTo(x - 16, y + 12); g.closePath(); g.fill();
  g.fillStyle = '#F4F1EA'; g.beginPath(); g.moveTo(x - 2, y - 4); g.lineTo(x - 2, y - 40); g.lineTo(x + 22, y - 8); g.closePath(); g.fill(); g.restore();
}
// V-59: đường mòn (nét đứt mảnh, không viền) — đường núi / đường cát đoàn buôn; quan đạo lát đá dùng road()
function trail(g, pts, color = 'rgba(122,88,52,.9)') {
  if (pts.length < 2) return;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(243,233,210,.75)'; g.lineWidth = 12; g.beginPath(); g.moveTo(...pts[0]); for (const q of pts.slice(1)) g.lineTo(...q); g.stroke();
  g.setLineDash([16, 11]); g.strokeStyle = color; g.lineWidth = 6; g.beginPath(); g.moveTo(...pts[0]); for (const q of pts.slice(1)) g.lineTo(...q); g.stroke();
  g.restore();
}
// khung biểu tượng + nhãn tên từng nơi (cùng số đo với label()) — đường bộ không đi vào khung nào
function placeBoxes(g) {
  g.save(); g.font = `700 ${LABEL_VI}px "Be Vietnam Pro"`;
  const out = PLACES.flatMap(p => {
    const half = g.measureText(p.name).width / 2 + 7, lx = Math.min(Math.max(p.x, half + 24), W - half - 24);
    const vy = p.y + LABEL_DY + LABEL_VI * 0.8;
    return [{ x0: p.x - 62, x1: p.x + 62, y0: p.y - 72, y1: p.y + 46 }, { x0: lx - half, x1: lx + half, y0: vy - LABEL_VI * 0.8 - 4, y1: vy + 14 }];
  });
  g.restore(); return out;
}
// giữ đoạn liền dài nhất của đường nằm ngoài mọi khung (cách mép m px) — đường dừng trước biểu tượng / chữ hai đầu
function clearOf(pts, boxes, m = 16) {
  const free = q => !boxes.some(b => q[0] > b.x0 - m && q[0] < b.x1 + m && q[1] > b.y0 - m && q[1] < b.y1 + m);
  let best = [], run = [];
  for (const q of pts) { if (free(q)) { run.push(q); if (run.length > best.length) best = run; } else run = []; }
  if (best.length < pts.filter(free).length) console.warn('đường bộ cắt ngang khung một nơi khác — chỉnh độ cong');
  return best;
}
// đường bộ nối các cặp cổng đi bộ trong cảnh (R-HANH-4, V-59): [nơi, nơi, độ cong, kiểu]. Yên Vũ Lâu ↔ Bồng Lai: đường thuyền.
const LAND_ROUTES = [
  ['van-uyen', 'rung-truc', -60, 'mon'],        // xuống núi Ba Thục → thung lũng Trúc Lâm
  ['rung-truc', 'giang-nam', 40, 'lat'],        // quan đạo Trung Nguyên → Ngô Việt
  ['rung-truc', 'truong-thanh', 60, 'mon'],     // đường núi lên Yên Vân
  ['truong-thanh', 'to-lua', 50, 'cat'],        // đường cát đoàn buôn ra Tây Vực
  ['truong-thanh', 'tu-cam-thanh', -50, 'lat'], // quan đạo dọc chân Trường Thành về kinh
  ['giang-nam', 'tu-cam-thanh', -60, 'lat']     // quan đạo Ngô Việt → Kinh Kỳ

function landRoutes(g) {
  const boxes = placeBoxes(g), at = p => [p.x, p.y + 10];
  for (const [a, b, bend, kind] of LAND_ROUTES) {
    const pts = clearOf(curve(at(P(a)), at(P(b)), bend, 200), boxes);

  }

function routes(g) {
  const home = P('van-uyen'), at = p => [p.x, p.y + 10];
  landRoutes(g);
  // đường cụt vào vùng chưa khám phá (nơi mới sau này)
  road(g, trim(curve(at(P('rung-truc')), [620, 1140], -20), 120, 0), 0.4);                     // → Điền Nam
  road(g, trim(curve(at(P('truong-thanh')), [P('truong-thanh').x + 10, 12], 10), 90, 0), 0.5); // → Mạc Bắc qua cổng
  road(g, trim(curve(at(P('to-lua')), [20, 230], 30), 150, 0), 0.4);                          // → tây
  // Ngô Việt → bến bờ đông → đường biển sang Bồng Lai; một tuyến mờ ra khơi
  const port = [coastX(700) - 4, 700];
  road(g, trim(curve(at(P('giang-nam')), port, 30), 120, 0));
  seaRoute(g, curve(port, [BL.x - 110, BL.y + 30], -40, 12));

    g.fillStyle = '#E9D7C9'; g.beginPath(); g.ellipse(x, y + 70, 140, 24, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#F6E7EC'; g.beginPath(); g.moveTo(x - 90, y + 66); g.quadraticCurveTo(x - 100, y - 40, x - 10, y - 120); g.quadraticCurveTo(x + 10, y - 140, x + 30, y - 110); g.quadraticCurveTo(x + 100, y - 20, x + 90, y + 66); g.closePath(); g.fill();
    g.strokeStyle = '#C9A7B8'; g.lineWidth = 6; for (const k of [0.35, 0.6, 0.82]) { g.beginPath(); g.moveTo(x - 90 * k - 10, y + 66 - 150 * (1 - k)); g.quadraticCurveTo(x, y + 30 - 150 * (1 - k), x + 90 * k + 10, y + 66 - 150 * (1 - k) - 10); g.stroke(); }
    g.fillStyle = 'rgba(90,150,160,.8)'; g.beginPath(); g.ellipse(x, y + 30, 22, 34, 0, Math.PI, 0); g.fill(); g.fillRect(x - 22, y + 30, 44, 36);
    g.strokeStyle = '#E87A6E'; g.lineCap = 'round'; g.lineWidth = 10;
    for (const [bx, s] of [[-125, -1], [125, 1]]) { g.beginPath(); g.moveTo(x + bx, y + 70); g.lineTo(x + bx, y + 10); g.moveTo(x + bx, y + 40); g.lineTo(x + bx + s * 26, y + 4); g.moveTo(x + bx, y + 25); g.lineTo(x + bx - s * 22, y - 6); g.stroke(); }
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 4;
    for (const [bx, by, r] of [[60, -150, 12], [80, -185, 8], [52, -210, 6], [-70, -130, 9]]) { g.beginPath(); g.arc(x + bx, y + by, r, 0, Math.PI * 2); g.stroke(); }
    g.restore();
  },
  // Đỉnh Hạc Bay (V-107): rừng cột đá, đình bát giác cột son + tùng cổ trên cột cao nhất, hạc bay (không tổ hạc)
  'truong-thanh'(g, x, y) {
    g.save();
    for (const [dx, top, w, c] of [[-105, -40, 50, '#A7A9A6'], [100, -20, 54, '#9EA19E'], [0, -105, 74, '#B6B8B4']]) {
      g.fillStyle = c; g.beginPath(); g.moveTo(x + dx - w / 2 - 8, y + 90); g.lineTo(x + dx - w / 2, y + top); g.lineTo(x + dx + w / 2, y + top); g.lineTo(x + dx + w / 2 + 8, y + 90); g.closePath(); g.fill();
      g.fillStyle = 'rgba(70,74,72,.25)'; g.fillRect(x + dx + w / 6, y + top, w / 3, 90 - top);
      g.fillStyle = '#86A86A'; g.beginPath(); g.ellipse(x + dx, y + top, w / 2 + 4, 8, 0, 0, Math.PI * 2); g.fill();
    }
    const py = y - 110;
    g.fillStyle = SON; for (const dx of [-26, -9, 9, 26]) g.fillRect(x + dx - 4, py - 44, 8, 40);
    g.fillStyle = '#D9D4C7'; g.fillRect(x - 36, py - 6, 72, 8);
    roof(g, x, py - 74, 84, 30, '#3E5A50');
    g.fillStyle = GOLD; g.beginPath(); g.moveTo(x, py - 96); g.lineTo(x + 6, py - 74); g.lineTo(x - 6, py - 74); g.closePath(); g.fill();
    g.strokeStyle = '#6B5A45'; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); g.moveTo(x + 40, py - 2); g.quadraticCurveTo(x + 52, py - 40, x + 74, py - 56); g.stroke();
    g.fillStyle = '#4E7A52'; for (const [tx, ty, w] of [[62, -58, 30], [86, -66, 24], [76, -42, 22]]) { g.beginPath(); g.ellipse(x + tx, py + ty, w, 10, -0.2, 0, Math.PI * 2); g.fill(); }
    g.strokeStyle = INK; g.lineWidth = 5;
    for (const [cx, cy, w] of [[-90, -230, 26], [-40, -255, 18]]) { g.beginPath(); g.moveTo(x + cx - w, y + cy); g.quadraticCurveTo(x + cx - w / 2, y + cy - w * 0.6, x + cx, y + cy); g.quadraticCurveTo(x + cx + w / 2, y + cy - w * 0.6, x + cx + w, y + cy); g.stroke(); }
    g.restore();
  },
  // Rừng Nấm Tiên (V-107): nấm khổng lồ mũ hồng chấm trắng, lò đồng ba chân trên mũ nấm, khói tím; nấm nhỏ cạnh
  'tu-cam-thanh'(g, x, y) {
    g.save();
    g.fillStyle = '#B98FC2'; g.beginPath(); g.ellipse(x - 105, y + 60, 34, 18, 0, Math.PI, 0); g.fill(); g.fillStyle = '#F1E6D8'; g.fillRect(x - 112, y + 60, 14, 26);
    g.fillStyle = '#F1E6D8'; g.beginPath(); g.moveTo(x - 30, y + 86); g.quadraticCurveTo(x - 20, y + 10, x - 22, y - 30); g.lineTo(x + 22, y - 30); g.quadraticCurveTo(x + 20, y + 10, x + 30, y + 86); g.closePath(); g.fill();
    g.fillStyle = '#E58BA0'; g.beginPath(); g.moveTo(x - 120, y - 22); g.quadraticCurveTo(x - 110, y - 110, x, y - 112); g.quadraticCurveTo(x + 110, y - 110, x + 120, y - 22); g.quadraticCurveTo(x, y - 6, x - 120, y - 22); g.fill();
    g.fillStyle = '#FBF3F0'; for (const [dx, dy, r] of [[-70, -50, 12], [-20, -82, 10], [40, -64, 13], [86, -40, 9], [-96, -30, 7]]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, Math.PI * 2); g.fill(); }
    const by = y - 112;
    g.fillStyle = '#9A6A3A'; for (const dx of [-26, 0, 26]) g.fillRect(x + dx - 4, by - 18, 8, 20);
    g.fillStyle = '#B07A42'; g.beginPath(); g.ellipse(x, by - 34, 38, 24, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#7E5530'; g.fillRect(x - 42, by - 56, 84, 8); g.fillRect(x - 34, by - 70, 8, 16); g.fillRect(x + 26, by - 70, 8, 16);
    g.fillStyle = 'rgba(176,132,200,.75)';
    for (const [dx, dy, r] of [[-6, -92, 18], [12, -118, 22], [-10, -148, 18], [16, -172, 14]]) { g.beginPath(); g.arc(x + dx, by + dy, r, 0, Math.PI * 2); g.fill(); }
    g.restore();
  },
  // Thành Cát Ngủ Quên (V-107): cổng thành có lầu lún nửa trong cát, đầu lạc đà đá
  'to-lua'(g, x, y) {
    g.save();
    g.fillStyle = '#C79A62'; g.fillRect(x - 90, y - 40, 180, 110);
    g.fillStyle = '#5B3E28'; g.beginPath(); g.moveTo(x - 30, y + 70); g.lineTo(x - 30, y + 20); g.quadraticCurveTo(x, y - 14, x + 30, y + 20); g.lineTo(x + 30, y + 70); g.closePath(); g.fill();
    g.fillStyle = '#B5864F'; for (let i = 0; i < 6; i++) g.fillRect(x - 90 + i * 32, y - 54, 20, 16);
    g.fillStyle = '#B04A36'; g.fillRect(x - 52, y - 98, 104, 44);
    g.fillStyle = 'rgba(60,40,30,.5)'; for (const dx of [-30, 0, 30]) g.fillRect(x + dx - 8, y - 90, 16, 30);
    roof(g, x, y - 130, 130, 34, '#6E4A35');
    g.fillStyle = '#E8C98E'; g.beginPath(); g.moveTo(x - 150, y + 90); g.quadraticCurveTo(x - 80, y + 10, x - 10, y + 52); g.quadraticCurveTo(x + 60, y + 20, x + 150, y + 90); g.closePath(); g.fill();
    g.fillStyle = '#A88A68'; g.fillRect(x + 92, y + 6, 18, 54);
    g.beginPath(); g.ellipse(x + 116, y + 2, 26, 15, -0.2, 0, Math.PI * 2); g.fill();
    g.fillStyle = INK; g.beginPath(); g.arc(x + 118, y - 2, 3.5, 0, Math.PI * 2); g.fill();
    g.restore();
  },
  // Nhà của ta 我家 (design 2026-11-14.13): tiểu viện — tường viện thấp, nhà chính mái xám cửa son, khóm trúc trái, đèn lồng đỏ phải
  'nha-ta'(g, x, y) {
    g.save();
    g.fillStyle = '#E3DCCD'; g.fillRect(x - 120, y + 10, 240, 50);
    g.fillStyle = '#4A4A52'; g.fillRect(x - 128, y, 256, 12);
    g.fillStyle = '#F1EBDD'; g.fillRect(x - 70, y - 60, 140, 70);
    g.fillStyle = SON; g.fillRect(x - 16, y - 44, 32, 54);
    g.fillStyle = 'rgba(36,50,58,.45)'; for (const dx of [-48, 48]) g.fillRect(x + dx - 12, y - 44, 24, 22);
    roof(g, x, y - 104, 160, 44, '#3E464E');
    g.lineCap = 'round';
    for (const [dx, h, c] of [[-104, 120, '#4F7A35'], [-84, 140, '#7D9A4A']]) {
      g.strokeStyle = c; g.lineWidth = 11; g.beginPath(); g.moveTo(x + dx, y + 50); g.lineTo(x + dx, y + 50 - h); g.stroke();
      g.fillStyle = '#5E8A3E'; for (let k = 0; k < 3; k++) { const ly = y + 60 - h + k * 24, s = k % 2 ? 1 : -1; g.beginPath(); g.ellipse(x + dx + s * 24, ly, 24, 7, s * -0.5, 0, Math.PI * 2); g.fill(); }
    }
    g.strokeStyle = INK; g.lineWidth = 4; g.beginPath(); g.moveTo(x + 104, y - 20); g.lineTo(x + 104, y - 4); g.stroke();
    g.fillStyle = SON; g.beginPath(); g.ellipse(x + 104, y + 14, 15, 19, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = GOLD; g.fillRect(x + 101, y + 32, 6, 12);
    g.restore();
  },
};

// nơi: đế tròn giấy dưới biểu tượng (đọc là "một điểm trên bản đồ") + tên
function placeBase(g, p) {
  if (p.de === 'nui' || p.de === 'song') return; // đứng trên đỉnh núi / yên ngựa đã vẽ ở massif / ridge
  if (p.de === 'dao') {
    // đảo nhỏ nổi trên biển mây: mặt cỏ + chóp đá treo, mây ôm chân
    const y = p.y + 22;
    g.save();
    g.fillStyle = '#8D8478'; g.beginPath(); g.moveTo(p.x - 64, y); g.lineTo(p.x + 64, y); g.lineTo(p.x + 16, y + 66); g.lineTo(p.x - 8, y + 58); g.closePath(); g.fill();
    g.fillStyle = '#6F675D'; g.beginPath(); g.moveTo(p.x + 10, y); g.lineTo(p.x + 64, y); g.lineTo(p.x + 16, y + 66); g.closePath(); g.fill();
    g.fillStyle = '#8DBF5A'; g.beginPath(); g.ellipse(p.x, y, 68, 15, 0, 0, Math.PI * 2); g.fill();
    g.restore();
    puff(g, p.x - 62, y + 50, 40, 0.95); puff(g, p.x + 70, y + 40, 36, 0.95);
    return;
  }
  g.save(); g.fillStyle = 'rgba(244,239,226,.85)'; g.strokeStyle = 'rgba(91,74,58,.55)'; g.lineWidth = 3;
  g.beginPath(); g.ellipse(p.x, p.y + 27, 56, 16, 0, 0, Math.PI * 2); g.fill(); g.stroke(); g.restore();
}
function label(g, p) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  g.font = `700 ${LABEL_VI}px "Be Vietnam Pro"`;
  const vy = p.y + LABEL_DY + LABEL_VI * 0.8;
  // giữ cả nhãn trong giấy — nơi sát mép (Cung Ngọc Đáy Biển) dời nhãn vào trong (V-50; tên V-53 dài nhất 16 ký tự)
  const half = g.measureText(p.name).width / 2 + 7, lx = Math.min(Math.max(p.x, half + 24), W - half - 24);
  g.lineWidth = 14; g.strokeStyle = 'rgba(242,234,218,.95)'; g.strokeText(p.name, lx, vy);
  g.fillStyle = INK; g.fillText(p.name, lx, vy);
  p.labelTop = Math.round(vy - LABEL_VI * 0.8); p.labelBottom = Math.round(vy + 12);
  g.restore();
}

async function draw() {
  await document.fonts.load(`700 ${LABEL_VI}px "Be Vietnam Pro"`, PLACES.map(p => p.name).join(' ') + ' B');
  const g = document.getElementById('c').getContext('2d', { willReadFrequently: true });
  paper(g);
  const ids = regionMap();
  paintLand(g, ids);
  sea(g);
  rivers(g);
  decorate(g, ids);
  desert(g); ridge(g); valley(g); massif(g); cloudSea(g); islandClouds(g);
  routes(g);
  vignette(g);
  for (const [x, y, s2] of [[975, 14, 0.6], [1990, 260, 0.8]]) cloud(g, x, y, s2, 0.6);
  // V-107: sương "chưa khám phá" dọc mép trên / dưới (không chữ — phiếu concept-the-gioi-moi)
  for (let x = 60; x < 1700; x += 150) { cloud(g, x, x % 300 ? 40 : 28, 0.75, 0.55); cloud(g, x + 70, 1150, 0.7, 0.5); }
  compass(g, 1930, 150);
  for (const p of PLACES) {
    if (!p.island) placeBase(g, p);
    g.save(); g.translate(p.x, p.y); g.scale(S, S); g.translate(-p.x, -p.y); ICONS[p.id](g, p.x, p.y); g.restore();
    label(g, p);
  }
  return PLACES.map(p => ({ id: p.id, han: p.han, name: p.name, x: p.x, y: p.y, r: p.r || R, labelTop: p.labelTop, labelBottom: p.labelBottom }));
}
window.ready = draw();

// ---------- lớp trạng thái (code vẽ chồng; đây là bản mẫu để duyệt) ----------
// Không vòng tròn. Đã mở: không vẽ gì. Sắp mở: huy hiệu đồng hồ. Đang ở đây: ghim tròn đầu nhân vật chính.
// V-54: biểu tượng nhỏ lại → ghim / huy hiệu sát biểu tượng hơn (cỡ giữ nguyên)
const PIN = { dx: -62, dy: -40, r: 52, vien: '#2B5446', net: 7, vienNgoai: '#D4A64A', netNgoai: 4, nen: '#F4F7F6', duoi: 24 };
const BADGE = { dx: 46, dy: -46, r: 28, nen: '#F4F7F6', vien: '#2B5446', vienCham: '#A8322A' };
function loadImg(src) { return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; }); }
async function makeAvatar() {
  const img = await loadImg('../../models/anh/nhan-vat-mat.png');
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 152, 70, 720, 720, 0, 0, 256, 256);
  const d = g.getImageData(0, 0, 256, 256), px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i], gg = px[i + 1], b = px[i + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    if (mx - mn < 10 && mn > 200 && mx < 236) px[i + 3] = 0;
  }
  g.putImageData(d, 0, 0);
  return c;
}
const avatarReady = makeAvatar();
function clock(g, x, y, ring) {
  const r = BADGE.r;
  g.save(); g.fillStyle = BADGE.nen; g.strokeStyle = ring; g.lineWidth = r * 0.16;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.stroke();
  g.strokeStyle = BADGE.vien; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y - r * 0.55); g.lineTo(x, y); g.lineTo(x + r * 0.4, y + r * 0.25); g.stroke(); g.restore();
}
function pin(g, x, y, av) {
  const cx = x + PIN.dx, cy = y + PIN.dy, r = PIN.r;
  g.save();
  g.fillStyle = 'rgba(36,50,58,.22)'; g.beginPath(); g.ellipse(cx, cy + r + PIN.duoi + 5, 20, 6, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = PIN.vien; g.beginPath(); g.moveTo(cx - 19, cy + r - 10); g.lineTo(cx, cy + r + PIN.duoi); g.lineTo(cx + 19, cy + r - 10); g.closePath(); g.fill();
  g.fillStyle = PIN.vienNgoai; g.beginPath(); g.arc(cx, cy, r + PIN.net + PIN.netNgoai, 0, Math.PI * 2); g.fill();
  g.fillStyle = PIN.vien; g.beginPath(); g.arc(cx, cy, r + PIN.net, 0, Math.PI * 2); g.fill();
  g.fillStyle = PIN.nen; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.clip(); g.drawImage(av, cx - r * 1.08, cy - r * 1.02, r * 2.16, r * 2.16);
  g.restore();
}
function drawState(g, p, st, av) {
  const { x, y } = p;
  if (st === 'sap-mo' || st === 'sap-mo-cham') clock(g, x + BADGE.dx, y + BADGE.dy, st === 'sap-mo-cham' ? BADGE.vienCham : BADGE.vien);
  if (st === 'o-day') pin(g, x, y, av);
}
window.states = async (map) => { const meta = await window.ready; const av = await avatarReady; const g = document.getElementById('c').getContext('2d'); for (const p of meta) if (map[p.id]) drawState(g, p, map[p.id], av); return true; };
window.avatarPng = async () => (await avatarReady).toDataURL('image/png');

(async () => {
  const q = new URLSearchParams(location.search);
  if (!q.has('xuat')) return;
  const meta = await window.ready;
  if (q.has('trangthai')) await window.states({ 'van-uyen': 'o-day', 'rung-truc': 'mo', 'giang-nam': 'sap-mo', 'bong-lai': 'sap-mo', 'truong-thanh': 'sap-mo', 'tu-cam-thanh': 'sap-mo', 'to-lua': 'sap-mo' });
  const t = document.createElement('textarea'); t.id = 'out';
  t.value = document.getElementById('c').toDataURL('image/png');
  document.body.appendChild(t);
  const m = document.createElement('textarea'); m.id = 'meta'; m.value = JSON.stringify(meta); document.body.appendChild(m);
})();
</script>
