<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bản đồ truyền tống</title>
<!-- font đóng gói của web/ (cần đã chạy npm install trong web/) — không cần mạng -->
<link rel="stylesheet" href="../../../web/node_modules/@fontsource/be-vietnam-pro/700.css">
<link rel="stylesheet" href="../../../web/node_modules/@fontsource/noto-serif-sc/700.css">
<style>body{margin:0;background:#888} canvas{width:1024px;height:576px;display:block}</style>
</head>
<body>
<canvas id="c" width="2048" height="1152"></canvas>
<script>
// Bản đồ truyền tống — thế giới chia VÙNG (design 2026-11-14.6; .7: chỉ chữ Việt, bỏ đường toả về nhà). Nền là bản đồ các miền (Tây Vực, Yên Vân, Kinh Kỳ, Trung
// Nguyên, Ba Thục, Ngô Việt, Đông Hải; còn Mạc Bắc, Lĩnh Nam, Điền Nam chưa khám phá). Mỗi NƠI đi được (7 cảnh + Nhà của ta) chỉ là
// một điểm nhỏ trong vùng của nó; quan đạo toả từ Văn Uyên Tông. Toạ độ theo ảnh 2048 × 1152 (gốc trên trái).
// Xuất ảnh: ?xuat → dataURL PNG ghi vào <textarea id="out"> (hoặc gọi window.ready qua DevTools).
const W = 2048, H = 1152;
const PAPER = '#F2EADA', INK = '#24323A', JADE = '#2B5446', SON = '#A8322A', GOLD = '#C9A13B';
const SEA = '#BFD5D1', SEA_DEEP = '#A9C6C2', COAST = '#6F9590';

// VÙNG: seed = hạt phân vùng (có thể nằm ngoài giấy), lx/ly = chỗ viết tên vùng; wild = chưa khám phá
const REGIONS = [
  { id: 'tay-vuc',      han: '西域', name: 'Tây Vực',      seed: [260, 330],   lx: 190,  ly: 538,  tint: '#EAD7A8' },
  { id: 'yen-van',      han: '燕雲', name: 'Yên Vân',      seed: [930, 270],   lx: 640,  ly: 215,  tint: '#D9D3B6' },
  { id: 'kinh-ky',      han: '京畿', name: 'Kinh Kỳ',      seed: [1470, 300],  lx: 1560, ly: 140,  tint: '#EDD0B6' },
  { id: 'trung-nguyen', han: '中原', name: 'Trung Nguyên', seed: [1000, 680],  lx: 990,  ly: 925,  tint: '#D3E2CD' },
  { id: 'ba-thuc',      han: '巴蜀', name: 'Ba Thục',      seed: [430, 840],   lx: 225,  ly: 770,  tint: '#C3D8A8' },
  { id: 'ngo-viet',     han: '吳越', name: 'Ngô Việt',     seed: [1430, 790],  lx: 1420, ly: 1050, tint: '#E2E6C2' },
  { id: 'linh-nam',     han: '嶺南', name: 'Lĩnh Nam',     seed: [980, 1290],  lx: 850,  ly: 1122, wild: true },
  { id: 'dien-nam',     han: '滇南', name: 'Điền Nam',     seed: [-80, 1180],  lx: 255,  ly: 1122, wild: true },
  { id: 'mac-bac',      han: '漠北', name: 'Mạc Bắc',      seed: null,         lx: 1260, ly: 44,   wild: true },
  { id: 'dong-hai',     han: '東海', name: 'Đông Hải',     sea: true,          lx: 1850, ly: 1010 }
];
// NƠI (cảnh đi được): x, y = tâm biểu tượng = tâm vùng chạm
const PLACES = [
  { id: 'to-lua',       han: '絲路', name: 'Con đường tơ lụa', x: 380,  y: 300 },
  { id: 'truong-thanh', han: '長城', name: 'Trường Thành',     x: 960,  y: 225 },
  { id: 'tu-cam-thanh', han: '紫禁', name: 'Tử Cấm Thành',     x: 1450, y: 290 },
  { id: 'rung-truc',    han: '竹林', name: 'Rừng trúc',        x: 480,  y: 770 },
  { id: 'van-uyen',     han: '起源', name: 'Khởi Nguyên Trấn',    x: 1000, y: 680 },
  { id: 'giang-nam',    han: '江南', name: 'Giang Nam',        x: 1450, y: 760 },
  { id: 'bong-lai',     han: '蓬萊', name: 'Bồng Lai',         x: 1880, y: 610, island: true },
  { id: 'nha-ta',       han: '我家', name: 'Nhà của ta',       x: 1190, y: 560, r: 80 }
];
const R = 105;          // vùng chạm quanh biểu tượng (nơi có r riêng thì dùng r riêng — Nhà của ta r 80, design 2026-11-14.13)
const S = 0.6;          // cỡ biểu tượng
const LABEL_VI = 46, LABEL_DY = 76;

function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const rand = rnd(7);

// nhiễu giá trị mượt (ranh giới vùng, bờ biển uốn tự nhiên)
function hash(i, j, s) { let h = (i * 374761393 + j * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function noise(x, y, s) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(i, j, s), b = hash(i + 1, j, s), c = hash(i, j + 1, s), d = hash(i + 1, j + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) { return noise(x, y, s) * 0.6 + noise(x * 2.1, y * 2.1, s + 9) * 0.28 + noise(x * 4.3, y * 4.3, s + 17) * 0.12; }

// bờ đông đại lục, Trường Thành (ranh Mạc Bắc), đảo Bồng Lai
function coastX(y) { return 1690 + 60 * Math.sin(y / 190) + 26 * Math.sin(y / 61 + 1.3) - 70 * Math.exp(-(((y - 690) / 150) ** 2)) + (fbm(0.5, y / 90, 3) - 0.5) * 70; }
function wallY(x) { return 92 + Math.sin(x / 90) * 16 + Math.sin(x / 37) * 5; }
const BL = PLACES.find(p => p.island);
function islandR(a) { return 1 + (fbm(Math.cos(a) * 1.6 + 5, Math.sin(a) * 1.6 + 5, 41) - 0.5) * 0.5; }
function onIsland(x, y) {
  const dx = (x - BL.x) / 130, dy = (y - (BL.y + 15)) / 112, d = Math.hypot(dx, dy);
  return d < islandR(Math.atan2(dy, dx));
}
const RI = id => REGIONS.findIndex(r => r.id === id);
const SEA_ID = -1, BL_REGION = RI('dong-hai');

// ---------- phân vùng: điểm đất thuộc hạt gần nhất (khoảng cách nhiễu); bắc tường = Mạc Bắc ----------
function regionMap() {
  const ids = new Int8Array(W * H).fill(SEA_ID);
  const seeded = REGIONS.map((r, i) => [r, i]).filter(([r]) => r.seed);
  const mb = RI('mac-bac');
  for (let y = 0; y < H; y++) {
    const cx = coastX(y);
    for (let x = 0; x < W; x++) {
      const k = y * W + x;
      if (x < cx) {
        if (y < wallY(x)) { ids[k] = mb; continue; }
        const wx = x + (fbm(x / 170, y / 170, 5) - 0.5) * 220, wy = y + (fbm(x / 170 + 30, y / 170, 6) - 0.5) * 220;
        let best = -1, bd = 1e18;
        for (const [r, i] of seeded) { const d = (wx - r.seed[0]) ** 2 + ((wy - r.seed[1]) * 1.1) ** 2; if (d < bd) { bd = d; best = i; } }
        ids[k] = best;
      } else if (onIsland(x, y)) ids[k] = BL_REGION;
    }
  }
  return ids;
}

function paintLand(g, ids) {
  const img = g.getImageData(0, 0, W, H), px = img.data;
  const hex = h => [1, 3, 5].map(o => parseInt(h.slice(o, o + 2), 16));
  const tint = REGIONS.map(r => r.wild ? [0xEC, 0xE5, 0xD3] : r.sea ? hex('#DCEBC6') : hex(r.tint));
  const br = [0x5B, 0x4A, 0x3A];
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? -9 : ids[y * W + x];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = y * W + x, id = ids[k];
    if (id === SEA_ID) continue;
    const c = tint[id], wild = REGIONS[id].wild;
    let edge = 0, line = false;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = at(x + dx * 2, y + dy * 2); if (n >= 0 && n !== id) line = true; }
    if (!line) for (const [dx, dy] of [[16, 0], [-16, 0], [0, 16], [0, -16], [11, 11], [-11, 11], [11, -11], [-11, -11]]) {
      const n = at(x + dx, y + dy); if (n >= 0 && n !== id) { edge = 1; break; }
    }
    const gr = noise(x / 5, y / 5, 77) > 0.5 ? 3 : 0;
    const hatch = wild && ((x + y) % 22) < 2 ? 10 : 0;
    let r = c[0] - gr - hatch, gg = c[1] - gr - hatch, b = c[2] - gr - hatch;
    if (edge) { r *= 0.94; gg *= 0.94; b *= 0.94; }
    // ranh vùng: nét mực nâu đứt (kiểu ranh giới hành chính trên bản đồ cổ)
    if (line && ((x + y) >> 3) % 3 !== 2) { r = r * 0.3 + br[0] * 0.7; gg = gg * 0.3 + br[1] * 0.7; b = b * 0.3 + br[2] * 0.7; }
    const o = k * 4; px[o] = r; px[o + 1] = gg; px[o + 2] = b; px[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

function paper(g) {
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = `rgba(120,100,70,${0.015 + rand() * 0.02})`;
    g.fillRect(rand() * W, rand() * H, 1 + rand() * 3, 1 + rand() * 2);
  }
}
function vignette(g) {
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  v.addColorStop(0, 'rgba(160,130,90,0)'); v.addColorStop(1, 'rgba(160,130,90,.22)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

function islandPath(g, off, begin = true) {
  if (begin) g.beginPath();
  for (let a = 0; a <= Math.PI * 2 + 0.001; a += 0.02) {
    const rr = islandR(a), x = BL.x + Math.cos(a) * (130 * rr + off), y = BL.y + 15 + Math.sin(a) * (112 * rr + off);
    a ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function sea(g) {
  g.save();
  g.beginPath(); g.moveTo(W, 0); for (let y = 0; y <= H; y += 4) g.lineTo(coastX(y), y); g.lineTo(W, H); g.closePath();
  islandPath(g, 0, false);
  const s = g.createLinearGradient(1500, 0, W, 0); s.addColorStop(0, SEA); s.addColorStop(1, SEA_DEEP);
  g.fillStyle = s; g.fill('evenodd');
  g.lineCap = 'round';
  for (const [off, a] of [[26, 0.55], [58, 0.35], [96, 0.2]]) {
    g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 5; g.setLineDash([60, 34]);
    g.beginPath(); for (let y = 0; y <= H; y += 6) { const x = coastX(y) + off; y ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
    islandPath(g, off); g.stroke();
  }
  g.setLineDash([]);
  g.strokeStyle = COAST; g.lineWidth = 6;
  g.beginPath(); for (let y = 0; y <= H; y += 4) { const x = coastX(y); y ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  islandPath(g, 0); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 5;
  for (const [x, y] of [[1840, 380], [1990, 470], [1800, 1080], [1990, 1110], [1990, 300]]) {
    g.beginPath(); g.arc(x - 18, y, 18, Math.PI * 1.1, Math.PI * 1.9); g.arc(x + 18, y, 18, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  }
  g.restore();
}

// ---------- sông: Hoàng Hà (bắc) và Trường Giang (nam) chảy ra biển đông ----------
function smooth(g, pts) {
  g.beginPath(); g.moveTo(...pts[0]);
  for (let i = 1; i < pts.length - 1; i++) { const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]; g.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
  g.lineTo(...pts[pts.length - 1]);
}
function rivers(g) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const hh = [[30, 470], [180, 500], [330, 455], [520, 505], [700, 470], [860, 520], [1040, 470], [1200, 510], [1360, 465], [1530, 505], [coastX(500) + 4, 500]];
  const tg = [[20, 1000], [190, 960], [380, 1010], [560, 965], [740, 1015], [920, 975], [1100, 1020], [1280, 975], [1460, 1010], [coastX(990) + 4, 990]];
  for (const pts of [hh, tg]) {
    g.strokeStyle = COAST; g.globalAlpha = 0.55; g.lineWidth = 26; smooth(g, pts); g.stroke();
    g.globalAlpha = 1; g.strokeStyle = SEA; g.lineWidth = 18; smooth(g, pts); g.stroke();
  }
  g.restore();
}

// ---------- trang trí theo vùng (né biểu tượng, nhãn nơi, tên vùng) ----------
const placed = [];
function blocked(x, y) {
  for (const p of PLACES) if (Math.abs(x - p.x) < 200 && y > p.y - 120 && y - 60 < p.y + 190) return true;
  for (const r of REGIONS) if (Math.abs(x - r.lx) < 330 && y > r.ly - 40 && y - 60 < r.ly + 40) return true; // tên vùng (chữ Việt dài)
  if (x < 210 && y < 230) return true;            // dấu triện
  if (x > 1820 && y < 260) return true;           // la bàn
  return placed.some(([px, py]) => Math.hypot(px - x, py - y) < 85);
}
function scatter(g, ids, rid, n, seed, drawFn) {
  const r = rnd(seed), idx = RI(rid); let done = 0;
  for (let t = 0; t < n * 80 && done < n; t++) {
    const x = 40 + r() * (W - 80), y = 40 + r() * (H - 80);
    if (ids[(y | 0) * W + (x | 0)] !== idx || blocked(x, y)) continue;
    let ok = true; for (const [dx, dy] of [[40, 0], [-40, 0], [0, 40], [0, -40]]) { const xx = x + dx | 0, yy = y + dy | 0; if (xx < 0 || yy < 0 || xx >= W || yy >= H || ids[yy * W + xx] !== idx) ok = false; }
    if (!ok) continue;
    drawFn(g, x, y, r); placed.push([x, y]); done++;
  }
}
function peak(g, x, y, s, c1, c2) {
  g.fillStyle = c1; g.beginPath(); g.moveTo(x - 46 * s, y); g.lineTo(x, y - 60 * s); g.lineTo(x + 46 * s, y); g.closePath(); g.fill();
  g.fillStyle = c2; g.beginPath(); g.moveTo(x, y - 60 * s); g.lineTo(x + 46 * s, y); g.lineTo(x + 8 * s, y); g.closePath(); g.fill();
}
function pine(g, x, y, s, c) { g.fillStyle = '#6B5A45'; g.fillRect(x - 3 * s, y - 6 * s, 6 * s, 10 * s); g.fillStyle = c; g.beginPath(); g.moveTo(x - 16 * s, y - 4 * s); g.lineTo(x, y - 40 * s); g.lineTo(x + 16 * s, y - 4 * s); g.closePath(); g.fill(); }
function decorate(g, ids) {
  g.save();
  const dune = (g, x, y, r) => { g.strokeStyle = 'rgba(176,138,82,.55)'; g.lineWidth = 6; g.lineCap = 'round'; const w = 46 + r() * 36; g.beginPath(); g.moveTo(x - w, y); g.quadraticCurveTo(x - w * 0.2, y - 26, x + w, y); g.stroke(); };
  const grey = (g, x, y, r) => peak(g, x, y, 0.7 + r() * 0.6, 'rgba(150,145,130,.5)', 'rgba(120,115,100,.5)');
  scatter(g, ids, 'tay-vuc', 12, 11, dune);
  scatter(g, ids, 'mac-bac', 6, 19, dune);
  scatter(g, ids, 'yen-van', 9, 12, (g, x, y, r) => peak(g, x, y, 0.8 + r() * 0.6, '#A9A58E', '#8F8B76'));
  scatter(g, ids, 'trung-nguyen', 6, 13, (g, x, y, r) => peak(g, x, y, 0.8 + r() * 0.6, '#9DB49C', '#7F9A82'));
  scatter(g, ids, 'trung-nguyen', 6, 14, (g, x, y, r) => pine(g, x, y, 0.9 + r() * 0.4, '#5E8A5E'));
  scatter(g, ids, 'kinh-ky', 8, 15, (g, x, y, r) => { g.strokeStyle = 'rgba(170,120,80,.45)'; g.lineWidth = 4; const s = 24 + r() * 10; g.strokeRect(x - s, y - s * 0.6, s * 2, s * 1.2); g.beginPath(); g.moveTo(x, y - s * 0.6); g.lineTo(x, y + s * 0.6); g.stroke(); });
  scatter(g, ids, 'ba-thuc', 8, 16, (g, x, y, r) => peak(g, x, y, 0.8 + r() * 0.5, '#93AE86', '#7C9870'));
  scatter(g, ids, 'ba-thuc', 8, 22, (g, x, y, r) => { g.lineCap = 'round'; for (const dx of [-10, 0, 10]) { g.strokeStyle = dx ? '#5E8A3E' : '#4F7A35'; g.lineWidth = 6; g.beginPath(); g.moveTo(x + dx, y); g.lineTo(x + dx * 1.3, y - 40 - r() * 14); g.stroke(); } });
  scatter(g, ids, 'ngo-viet', 7, 17, (g, x, y, r) => { g.fillStyle = 'rgba(160,200,196,.95)'; g.beginPath(); g.ellipse(x, y, 32 + r() * 18, 13 + r() * 6, 0, 0, Math.PI * 2); g.fill(); });
  scatter(g, ids, 'ngo-viet', 5, 18, (g, x, y) => { g.fillStyle = '#F4F1EA'; g.fillRect(x - 14, y - 16, 28, 18); g.fillStyle = '#3A3F44'; g.fillRect(x - 18, y - 22, 36, 7); });
  scatter(g, ids, 'linh-nam', 8, 23, grey);
  scatter(g, ids, 'dien-nam', 5, 24, grey);
  g.restore();
}

function cloud(g, x, y, s, a) {
  g.save(); g.globalAlpha = a; g.fillStyle = '#FFFFFF';
  for (const [dx, dy, r] of [[0, 0, 60], [60, -18, 46], [-58, -10, 44], [110, 8, 36], [-104, 10, 34]]) {
    g.beginPath(); g.ellipse(x + dx * s, y + dy * s, r * s * 1.4, r * s * 0.7, 0, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}
function compass(g, x, y) {
  g.save(); g.translate(x, y);
  g.strokeStyle = INK; g.lineWidth = 4; g.globalAlpha = 0.8;
  g.beginPath(); g.arc(0, 0, 54, 0, Math.PI * 2); g.stroke();
  g.fillStyle = SON; g.beginPath(); g.moveTo(0, -70); g.lineTo(14, 0); g.lineTo(-14, 0); g.closePath(); g.fill();
  g.fillStyle = INK; g.beginPath(); g.moveTo(0, 70); g.lineTo(14, 0); g.lineTo(-14, 0); g.closePath(); g.fill();
  g.globalAlpha = 1; g.fillStyle = INK; g.font = '700 34px "Be Vietnam Pro"'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('B', 0, -96);
  g.restore();
}

// ---------- đường: quan đạo toả từ nhà, đường biển, đường cụt vào vùng chưa khám phá, Trường Thành ----------
const P = id => PLACES.find(p => p.id === id);
function curve(a, b, bend, n = 120) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const c = [mx - (dy / L) * bend, my + (dx / L) * bend], pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; pts.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]); }
  return pts;
}
// bỏ đoạn gần biểu tượng hai đầu (đường dừng trước biểu tượng, không đè hình / chữ)
function trim(pts, d0, d1) {
  const a = pts[0], b = pts[pts.length - 1];
  return pts.filter(q => Math.hypot(q[0] - a[0], q[1] - a[1]) > d0 && Math.hypot(q[0] - b[0], q[1] - b[1]) > d1);
}
function road(g, pts, fade = 1) {
  if (pts.length < 2) return;
  const n = pts.length - 1, cut = Math.round(n * fade);
  const seg = (from, to) => { g.beginPath(); g.moveTo(...pts[from]); for (let i = from + 1; i <= to; i++) g.lineTo(...pts[i]); };
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(138,100,62,.8)'; g.lineWidth = 16; seg(0, cut); g.stroke();
  g.strokeStyle = '#F3E9D2'; g.lineWidth = 7; seg(0, cut); g.stroke();
  if (cut < n) {
    g.setLineDash([14, 12]);
    for (let i = cut; i < n; i++) {
      g.globalAlpha = 0.85 * (1 - (i - cut) / (n - cut));
      g.strokeStyle = 'rgba(138,100,62,1)'; g.lineWidth = 8; seg(i, i + 1); g.stroke();
    }
  }
  g.restore();
}
function seaRoute(g, pts, boat = true) {
  g.save(); g.lineCap = 'round'; g.setLineDash([22, 16]); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(...pts[0]); for (const q of pts.slice(1)) g.lineTo(...q); g.stroke(); g.restore();
  if (!boat) return;
  const [x, y] = pts[Math.floor(pts.length / 2)];
  g.save(); g.fillStyle = '#6B4A30'; g.beginPath(); g.moveTo(x - 26, y); g.lineTo(x + 26, y); g.lineTo(x + 16, y + 12); g.lineTo(x - 16, y + 12); g.closePath(); g.fill();
  g.fillStyle = '#F4F1EA'; g.beginPath(); g.moveTo(x - 2, y - 4); g.lineTo(x - 2, y - 40); g.lineTo(x + 22, y - 8); g.closePath(); g.fill(); g.restore();
}
function greatWall(g) {
  const pts = []; for (let x = 120; x <= 1660; x += 20) pts.push([x, wallY(x)]);
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const part = keep => { g.beginPath(); let on = false; for (const q of pts) { if (keep(q[0])) { on ? g.lineTo(...q) : g.moveTo(...q); on = true; } else on = false; } };
  const gate = P('truong-thanh').x, open = x => Math.abs(x - gate) > 26;
  g.strokeStyle = '#7F7B6F'; g.lineWidth = 14; part(open); g.stroke();
  g.strokeStyle = '#B4AF9E'; g.lineWidth = 5; part(open); g.stroke();
  g.fillStyle = '#7F7B6F';
  for (const q of pts) if ((q[0] - 120) % 200 === 0 || Math.abs(q[0] - gate) === 40) { g.fillRect(q[0] - 11, q[1] - 26, 22, 26); g.fillRect(q[0] - 13, q[1] - 32, 6, 7); g.fillRect(q[0] + 7, q[1] - 32, 6, 7); }
  g.restore();
}
function routes(g) {
  const home = P('van-uyen'), at = p => [p.x, p.y + 10];
  greatWall(g);
  // đường cụt vào vùng chưa khám phá (nơi mới sau này)
  road(g, trim(curve(at(P('rung-truc')), [40, 1045], -40), 200, 0), 0.4);                     // → Điền Nam
  road(g, trim(curve(at(P('truong-thanh')), [P('truong-thanh').x + 10, 12], 10), 90, 0), 0.5); // → Mạc Bắc qua cổng
  road(g, trim(curve(at(P('to-lua')), [20, 230], 30), 150, 0), 0.4);                          // → tây
  // Ngô Việt → bến bờ đông → đường biển sang Bồng Lai; một tuyến mờ ra khơi
  const port = [coastX(700) - 4, 700];
  road(g, trim(curve(at(P('giang-nam')), port, 30), 120, 0));
  seaRoute(g, curve(port, [BL.x - 110, BL.y + 30], -40, 12));
  g.save(); g.globalAlpha = 0.5; seaRoute(g, curve([BL.x + 120, BL.y + 110], [2040, 880], 30, 10), false); g.restore();
}

// tên vùng: chữ Hán lớn mờ + tên Việt giãn chữ — nền nghĩa của bản đồ, không tranh với tên nơi
function regionLabel(g, r) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const ink = r.sea ? 'rgba(43,84,70,' : r.wild ? 'rgba(90,80,64,' : 'rgba(58,48,36,';
  if (r.wild) {
    // vùng chưa khám phá ở rìa (dải mỏng): một dòng "漠北 MẠC BẮC · chưa khám phá"
    g.textAlign = 'left';
    const w1 = -14;
    g.font = '700 26px "Be Vietnam Pro"'; g.letterSpacing = '4px';
    const t2 = r.name.toUpperCase(), w2 = g.measureText(t2).width;
    g.letterSpacing = '1px'; const t3 = ' · chưa khám phá', w3 = g.measureText(t3).width;
    let x = r.lx - (w1 + 14 + w2 + w3) / 2;
    x += w1 + 14;
    g.font = '700 26px "Be Vietnam Pro"'; g.letterSpacing = '4px'; g.fillStyle = ink + '.7)'; g.fillText(t2, x, r.ly); x += w2;
    g.letterSpacing = '1px'; g.fillStyle = ink + '.55)'; g.fillText(t3, x, r.ly);
    g.restore(); return;
  }
  // chỉ tiếng Việt (2026-11-14.7): tên vùng in hoa giãn chữ, mờ — nền nghĩa của bản đồ
  g.font = '700 46px "Be Vietnam Pro"'; g.letterSpacing = '12px';
  g.fillStyle = ink + '.42)'; g.fillText(r.name.toUpperCase(), r.lx + 6, r.ly + 20);
  g.restore();
}

// ---------- biểu tượng nơi ----------
function roof(g, cx, y, w, h, color) {
  g.fillStyle = color; g.beginPath();
  g.moveTo(cx - w / 2 - 18, y + h); g.quadraticCurveTo(cx - w / 2, y + h * 0.7, cx - w * 0.32, y);
  g.lineTo(cx + w * 0.32, y); g.quadraticCurveTo(cx + w / 2, y + h * 0.7, cx + w / 2 + 18, y + h); g.closePath(); g.fill();
}
function hall(g, cx, cy, s, roofColor, wallColor) {
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.fillStyle = '#D9D4C7'; g.fillRect(-90, 40, 180, 22);
  g.fillStyle = wallColor; g.fillRect(-70, -10, 140, 50);
  g.fillStyle = 'rgba(36,50,58,.5)'; for (const x of [-45, -15, 15, 45]) g.fillRect(x - 4, -10, 8, 50);
  roof(g, 0, -48, 180, 40, roofColor);
  g.fillStyle = INK; g.fillRect(-60, -50, 120, 6);
  g.restore();
}
const ICONS = {
  'van-uyen'(g, x, y) {
    hall(g, x, y + 10, 1.15, JADE, '#E8E1D2');
  },
  'rung-truc'(g, x, y) {
    g.save(); g.lineCap = 'round';
    for (const [dx, h, c] of [[-50, 190, '#4F7A35'], [0, 220, '#7D9A4A'], [48, 175, '#5E8A3E']]) {
      g.strokeStyle = c; g.lineWidth = 16; g.beginPath(); g.moveTo(x + dx, y + 80); g.lineTo(x + dx * 1.1, y + 80 - h); g.stroke();
      g.strokeStyle = PAPER; g.lineWidth = 3; for (let k = 1; k < 5; k++) { const yy = y + 80 - k * h / 5; g.beginPath(); g.moveTo(x + dx - 9, yy); g.lineTo(x + dx + 9, yy); g.stroke(); }
      g.fillStyle = '#5E8A3E';
      for (let k = 0; k < 4; k++) { const ly = y + 80 - h + 20 + k * 22, s = k % 2 ? 1 : -1; g.beginPath(); g.ellipse(x + dx + s * 34, ly, 34, 9, s * -0.5, 0, Math.PI * 2); g.fill(); }
    }
    g.restore();
  },
  'giang-nam'(g, x, y) {
    g.save();
    g.fillStyle = 'rgba(122,160,160,.6)'; g.fillRect(x - 110, y + 50, 220, 30);
    g.strokeStyle = '#9A968C'; g.lineWidth = 18; g.beginPath(); g.arc(x - 10, y + 70, 70, Math.PI, 0); g.stroke();
    g.fillStyle = '#F4F1EA'; g.fillRect(x + 40, y - 70, 80, 70);
    g.fillStyle = '#3A3F44'; roof(g, x + 80, y - 100, 90, 30, '#3A3F44');
    g.fillRect(x + 66, y - 40, 14, 22);
    g.restore();
  },
  'bong-lai'(g, x, y) {
    g.save();
    for (const [dx, dy, s] of [[-40, 10, 1], [70, -50, 0.7]]) {
      g.fillStyle = '#86AE5A'; g.beginPath(); g.ellipse(x + dx, y + dy, 80 * s, 22 * s, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#8D8A84'; g.beginPath(); g.moveTo(x + dx - 78 * s, y + dy); g.lineTo(x + dx + 78 * s, y + dy); g.lineTo(x + dx + 10 * s, y + dy + 110 * s); g.closePath(); g.fill();
    }
    hall(g, x - 40, y - 30, 0.42, JADE, '#E8E1D2');
    cloud(g, x - 10, y + 95, 0.8, 0.95);
    g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(x + 40, y - 120); g.quadraticCurveTo(x + 60, y - 135, x + 80, y - 120); g.quadraticCurveTo(x + 100, y - 135, x + 120, y - 120); g.stroke();
    g.restore();
  },
  'truong-thanh'(g, x, y) {
    g.save(); g.fillStyle = '#9A968C';
    g.beginPath(); g.moveTo(x - 130, y + 70); g.lineTo(x - 60, y + 20); g.lineTo(x + 20, y + 40); g.lineTo(x + 130, y - 10); g.lineTo(x + 130, y + 30); g.lineTo(x + 20, y + 80); g.lineTo(x - 60, y + 60); g.lineTo(x - 130, y + 100); g.closePath(); g.fill();
    g.fillStyle = '#7A766C'; g.fillRect(x - 10, y - 70, 64, 110);
    for (let i = 0; i < 4; i++) g.fillRect(x - 12 + i * 18, y - 86, 12, 18);
    g.fillStyle = INK; g.fillRect(x + 12, y - 40, 18, 26);
    g.strokeStyle = INK; g.lineWidth = 4; g.beginPath(); g.moveTo(x + 22, y - 86); g.lineTo(x + 22, y - 140); g.stroke();
    g.fillStyle = SON; g.beginPath(); g.moveTo(x + 22, y - 140); g.lineTo(x + 66, y - 128); g.lineTo(x + 22, y - 116); g.closePath(); g.fill();
    g.restore();
  },
  // Nhà của ta 我家 (design 2026-11-14.13): tiểu viện — tường viện thấp, nhà chính mái xám cửa son, khóm trúc trái, đèn lồng đỏ phải
  'nha-ta'(g, x, y) {
    g.save();
    g.fillStyle = '#E3DCCD'; g.fillRect(x - 120, y + 10, 240, 50);
    g.fillStyle = '#4A4A52'; g.fillRect(x - 128, y, 256, 12);
    g.fillStyle = '#F1EBDD'; g.fillRect(x - 70, y - 60, 140, 70);
    g.fillStyle = SON; g.fillRect(x - 16, y - 44, 32, 54);
    g.fillStyle = 'rgba(36,50,58,.45)'; for (const dx of [-48, 48]) g.fillRect(x + dx - 12, y - 44, 24, 22);
    roof(g, x, y - 104, 160, 44, '#3E464E');
    g.lineCap = 'round';
    for (const [dx, h, c] of [[-104, 120, '#4F7A35'], [-84, 140, '#7D9A4A']]) {
      g.strokeStyle = c; g.lineWidth = 11; g.beginPath(); g.moveTo(x + dx, y + 50); g.lineTo(x + dx, y + 50 - h); g.stroke();
      g.fillStyle = '#5E8A3E'; for (let k = 0; k < 3; k++) { const ly = y + 60 - h + k * 24, s = k % 2 ? 1 : -1; g.beginPath(); g.ellipse(x + dx + s * 24, ly, 24, 7, s * -0.5, 0, Math.PI * 2); g.fill(); }
    }
    g.strokeStyle = INK; g.lineWidth = 4; g.beginPath(); g.moveTo(x + 104, y - 20); g.lineTo(x + 104, y - 4); g.stroke();
    g.fillStyle = SON; g.beginPath(); g.ellipse(x + 104, y + 14, 15, 19, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = GOLD; g.fillRect(x + 101, y + 32, 6, 12);
    g.restore();
  },
  'tu-cam-thanh'(g, x, y) { hall(g, x, y + 10, 1.2, GOLD, SON); g.save(); g.fillStyle = GOLD; roof(g, x, y - 95, 120, 26, GOLD); g.restore(); },
  'to-lua'(g, x, y) {
    g.save(); g.fillStyle = '#D2B98C'; g.beginPath(); g.ellipse(x, y + 80, 150, 40, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#8A5B3B';
    g.beginPath(); g.ellipse(x - 10, y + 10, 62, 34, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x - 20, y - 22, 22, 22, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x + 18, y - 22, 22, 22, 0, 0, Math.PI * 2); g.fill();
    g.fillRect(x + 40, y - 50, 18, 60); g.beginPath(); g.ellipse(x + 64, y - 54, 22, 13, 0, 0, Math.PI * 2); g.fill();
    for (const lx of [-50, -26, 14, 36]) g.fillRect(x + lx, y + 30, 11, 50);
    g.restore();
  }
};

// nơi: đế tròn giấy dưới biểu tượng (đọc là "một điểm trên bản đồ") + tên
function placeBase(g, p) {
  g.save(); g.fillStyle = 'rgba(244,239,226,.85)'; g.strokeStyle = 'rgba(91,74,58,.55)'; g.lineWidth = 4;
  g.beginPath(); g.ellipse(p.x, p.y + 42, 92, 26, 0, 0, Math.PI * 2); g.fill(); g.stroke(); g.restore();
}
function label(g, p) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  g.font = `700 ${LABEL_VI}px "Be Vietnam Pro"`;
  const vy = p.y + LABEL_DY + LABEL_VI * 0.8;
  g.lineWidth = 14; g.strokeStyle = 'rgba(242,234,218,.95)'; g.strokeText(p.name, p.x, vy);
  g.fillStyle = INK; g.fillText(p.name, p.x, vy);
  p.labelTop = Math.round(vy - LABEL_VI * 0.8); p.labelBottom = Math.round(vy + 12);
  g.restore();
}

async function draw() {
  await document.fonts.load(`700 ${LABEL_VI}px "Be Vietnam Pro"`, 'Văn Uyên Tông Rừng trúc Trường Thành Tử Cấm Thành tơ lụa TÂY VỰC YÊN VÂN KINH KỲ TRUNG NGUYÊN BA THỤC NGÔ VIỆT LĨNH NAM ĐIỀN NAM MẠC BẮC ĐÔNG HẢI chưa khám phá');
  const g = document.getElementById('c').getContext('2d', { willReadFrequently: true });
  paper(g);
  const ids = regionMap();
  paintLand(g, ids);
  sea(g);
  rivers(g);
  decorate(g, ids);
  for (const r of REGIONS) regionLabel(g, r);
  routes(g);
  vignette(g);
  for (const [x, y, s2] of [[30, 1040, 0.7], [30, 230, 0.8], [975, 14, 0.6], [1990, 260, 0.8]]) cloud(g, x, y, s2, 0.6);
  compass(g, 1930, 150);
  for (const p of PLACES) {
    if (!p.island) placeBase(g, p);
    g.save(); g.translate(p.x, p.y); g.scale(S, S); g.translate(-p.x, -p.y); ICONS[p.id](g, p.x, p.y); g.restore();
    label(g, p);
  }
  return PLACES.map(p => ({ id: p.id, han: p.han, name: p.name, x: p.x, y: p.y, r: p.r || R, labelTop: p.labelTop, labelBottom: p.labelBottom }));
}
window.ready = draw();

// ---------- lớp trạng thái (code vẽ chồng; đây là bản mẫu để duyệt) ----------
// Không vòng tròn. Đã mở: không vẽ gì. Sắp mở: huy hiệu đồng hồ. Đang ở đây: ghim tròn đầu nhân vật chính.
const PIN = { dx: -72, dy: -40, r: 52, vien: '#2B5446', net: 7, vienNgoai: '#D4A64A', netNgoai: 4, nen: '#F4F7F6', duoi: 24 };
const BADGE = { dx: 62, dy: -62, r: 28, nen: '#F4F7F6', vien: '#2B5446', vienCham: '#A8322A' };
function loadImg(src) { return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; }); }
async function makeAvatar() {
  const img = await loadImg('../../models/anh/nhan-vat-mat.png');
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 152, 70, 720, 720, 0, 0, 256, 256);
  const d = g.getImageData(0, 0, 256, 256), px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i], gg = px[i + 1], b = px[i + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    if (mx - mn < 10 && mn > 200 && mx < 236) px[i + 3] = 0;
  }
  g.putImageData(d, 0, 0);
  return c;
}
const avatarReady = makeAvatar();
function clock(g, x, y, ring) {
  const r = BADGE.r;
  g.save(); g.fillStyle = BADGE.nen; g.strokeStyle = ring; g.lineWidth = r * 0.16;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.stroke();
  g.strokeStyle = BADGE.vien; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y - r * 0.55); g.lineTo(x, y); g.lineTo(x + r * 0.4, y + r * 0.25); g.stroke(); g.restore();
}
function pin(g, x, y, av) {
  const cx = x + PIN.dx, cy = y + PIN.dy, r = PIN.r;
  g.save();
  g.fillStyle = 'rgba(36,50,58,.22)'; g.beginPath(); g.ellipse(cx, cy + r + PIN.duoi + 5, 20, 6, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = PIN.vien; g.beginPath(); g.moveTo(cx - 19, cy + r - 10); g.lineTo(cx, cy + r + PIN.duoi); g.lineTo(cx + 19, cy + r - 10); g.closePath(); g.fill();
  g.fillStyle = PIN.vienNgoai; g.beginPath(); g.arc(cx, cy, r + PIN.net + PIN.netNgoai, 0, Math.PI * 2); g.fill();
  g.fillStyle = PIN.vien; g.beginPath(); g.arc(cx, cy, r + PIN.net, 0, Math.PI * 2); g.fill();
  g.fillStyle = PIN.nen; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.clip(); g.drawImage(av, cx - r * 1.08, cy - r * 1.02, r * 2.16, r * 2.16);
  g.restore();
}
function drawState(g, p, st, av) {
  const { x, y } = p;
  if (st === 'sap-mo' || st === 'sap-mo-cham') clock(g, x + BADGE.dx, y + BADGE.dy, st === 'sap-mo-cham' ? BADGE.vienCham : BADGE.vien);
  if (st === 'o-day') pin(g, x, y, av);
}
window.states = async (map) => { const meta = await window.ready; const av = await avatarReady; const g = document.getElementById('c').getContext('2d'); for (const p of meta) if (map[p.id]) drawState(g, p, map[p.id], av); return true; };
window.avatarPng = async () => (await avatarReady).toDataURL('image/png');

(async () => {
  const q = new URLSearchParams(location.search);
  if (!q.has('xuat')) return;
  const meta = await window.ready;
  if (q.has('trangthai')) await window.states({ 'van-uyen': 'o-day', 'rung-truc': 'mo', 'giang-nam': 'sap-mo', 'bong-lai': 'sap-mo', 'truong-thanh': 'sap-mo', 'tu-cam-thanh': 'sap-mo', 'to-lua': 'sap-mo' });
  const t = document.createElement('textarea'); t.id = 'out';
  t.value = document.getElementById('c').toDataURL('image/png');
  document.body.appendChild(t);
  const m = document.createElement('textarea'); m.id = 'meta'; m.value = JSON.stringify(meta); document.body.appendChild(m);
})();
</script>
