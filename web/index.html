<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tiểu Mặc 3D</title>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- HUD hướng C (design/source/HUD-*.dc.html) -->
  <div id="fps" hidden>— fps</div>

  <div id="joyGhost" aria-hidden="true"><div class="knob"></div><span>kéo để đi</span></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div class="label" id="nameTag">Tuấn Anh</div>

  <!-- ví Văn tiền 文錢 góc trên phải (R-TIEN-1), canvas VanTien-HUD-doc / -ngang; phần trong do JS dựng -->
  <div id="wallet" hidden><button id="walletBtn" type="button" aria-label="Văn tiền: 0"></button></div>

  <!-- nút học nổi trên vật học trong nhà (R-VUNG-1), canvas TrongNha-doc / TrongNha-ngang -->
  <button class="learn" id="learn" type="button" hidden>
    <span class="dot" aria-hidden="true"></span><span id="learnText"></span><span class="han" id="learnHan" lang="zh"></span>
  </button>

  <!-- cụm nút hành động (R-DIEU-6/7), canvas HUD-hanh-dong-doc / -ngang, NutHanhDong-trang-thai -->
  <div id="actions">
    <div class="act act-jump"><button id="actJump" type="button" aria-label="Nhảy"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M7 9l5-5 5 5"></path><path d="M5 20c1.5-1.6 3.5-1.6 5 0s3.5 1.6 5 0 3.5-1.6 4 0"></path></svg></button><span class="lbl">Nhảy</span><kbd class="key" aria-hidden="true">Space</kbd></div>
    <div class="act act-bow"><button id="actBow" type="button" aria-label="Chào"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9c0-2 1.6-3 3-3h4c1.6 0 3 1.2 3 3v4c0 3-2.2 5-5 5s-5-2-5-5z"></path><circle cx="12" cy="11.5" r="2.6"></circle><path d="M12 18v3"></path></svg></button><span class="lbl">Chào</span><kbd class="key" aria-hidden="true">F</kbd></div>
    <div class="act act-sit"><button id="actSit" type="button" aria-label="Ngồi ôn" aria-pressed="false"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.6" r="2.2"></circle><path d="M12 7v2.2"></path><path d="M7.5 9.6h9v4.6h-9z"></path><path d="M6 9v5.8M18 9v5.8"></path><path d="M9.5 11.9h5"></path><path d="M4 19.4c2.5-2.4 13.5-2.4 16 0"></path><ellipse cx="12" cy="20.8" rx="8" ry="1.3"></ellipse></svg><span class="badge" id="actSitBadge" aria-hidden="true" hidden></span></button><span class="lbl" id="actSitLabel">Ngồi ôn</span><kbd class="key" aria-hidden="true">C</kbd></div>
  </div>

  <!-- nút "Nói chuyện" bám trên NPC + khung thoại (R-NPC-2), canvas HUD-hanh-dong-doc, HoiThoai-doc / -ngang -->
  <div id="talk" hidden>
    <button id="talkBtn" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-8l-4 3v-3H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path><path d="M8 11h8"></path></svg>Nói chuyện</button>
    <div class="tip" aria-hidden="true"></div>
    <div class="who"><span id="talkName"></span> <span class="han" id="talkHan" lang="zh"></span></div>
  </div>
  <!-- thẻ "Đọc sách" trên cụm nút hành động khi đang mượn sổ từ (R-SACH-2), canvas DocSach-doc / -ngang -->
  <button id="readBook" type="button" hidden><span class="cover" id="readBookCover" lang="zh" aria-hidden="true"></span><span class="txt"><span class="name">Đọc sách</span><span class="book" id="readBookTitle"></span></span></button>
  <!-- nút "Xem bảng" trên bảng nhiệm vụ 日課榜 (R-NV-3), canvas XemBang-doc / -ngang -->
  <div id="board" hidden>
    <button id="boardBtn" type="button" aria-label="Xem bảng"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="14" rx="1.5"></rect><path d="M8 9h8M8 13h5M7 18v3M17 18v3"></path></svg>Xem bảng<span class="badge" id="boardBadge" aria-hidden="true" hidden></span></button>
    <div class="tip" aria-hidden="true"></div>
    <div class="who">Nhiệm vụ hằng ngày <span class="han" lang="zh">日課榜</span></div>
  </div>
  <!-- nút "Vào tiệm" trước cửa Tạp hoá 雜貨 (R-TIEN-6) — kiểu nút "Xem bảng" -->
  <div id="shop" hidden>
    <button id="shopBtn" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9c0 1.4 1.1 2.5 2.7 2.5S9.3 10.4 9.3 9c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.4 20 9"></path><path d="M5.5 11.5V20h13v-8.5"></path><path d="M10 20v-5h4v5"></path></svg>Vào tiệm</button>
    <div class="tip" aria-hidden="true"></div>
    <div class="who">Tạp hoá <span class="han" lang="zh">雜貨</span></div>
  </div>
  <!-- nút "Cách chơi" trên biển tên trò chơi Kỳ Văn Uyển (R-GIAO-2) — kiểu nút "Xem bảng" -->
  <div id="guide" hidden>
    <button id="guideBtn" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.3-2.5 3.9"></path><path d="M12 17.2h.01"></path></svg>Cách chơi</button>
    <div class="tip" aria-hidden="true"></div>
    <div class="who"><span id="guideName"></span> <span class="han" lang="zh" id="guideHan"></span></div>
  </div>
  <!-- HUD trò chơi Kỳ Văn Uyển khi ngồi vào bàn (R-GIAO-1, R-CO-3, R-DAU-2) — canvas Co-* / Dau-* (2026-11-13.27); JS dựng -->
  <div id="game" hidden></div>
  <!-- bảng cách chơi Kỳ Văn Uyển (R-GIAO-2) — canvas CachChoi-doc-* / CachChoi-ngang (2026-11-13.35); nội dung do JS dựng -->
  <div id="guidePanel" hidden>
    <section class="gp-card" role="dialog" aria-labelledby="gpName">
      <header class="gp-head">
        <div class="gp-titles">
          <div class="gp-eyebrow">Kỳ Văn Uyển · Cách chơi</div>
          <div class="gp-name"><span class="gp-han" lang="zh" id="gpHan"></span><span class="gp-vi" id="gpName"></span><span class="gp-intro gp-intro-row" id="gpIntroRow"></span></div>
          <div class="gp-intro" id="gpIntro"></div>
        </div>
        <button class="gp-close gp-close-top" id="gpCloseTop" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>Đóng</button>
      </header>
      <div class="gp-rule" aria-hidden="true"><span></span><span class="dot"></span><span></span></div>
      <div class="gp-body">
        <div class="gp-scroll" id="gpScroll">
          <div class="gp-side" id="gpSide"></div>
          <div class="gp-main" id="gpMain"></div>
        </div>
      </div>
      <footer class="gp-foot">
        <button class="gp-close" id="gpClose" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>Đóng</button>
      </footer>
    </section>
  </div>
  <div id="seat" hidden>
    <button id="seatBtn" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.3"></circle><path d="M12 8v6"></path><path d="M8 11.5c1.3 1 2.6 1.3 4 1.3s2.7-.3 4-1.3"></path><path d="M7 16.5c3-1.2 7-1.2 10 0"></path><ellipse cx="12" cy="19" rx="8" ry="2.4"></ellipse></svg><span id="seatLabel">Ngồi</span></button>
    <div class="tip" aria-hidden="true"></div>
  </div>
  <div id="dialogDim" aria-hidden="true"></div>
  <section id="dialog" aria-label="Hội thoại" hidden>
    <img id="dlgFace" alt="" />
    <div class="name"><span id="dlgName"></span> <span class="han" id="dlgHan" lang="zh"></span></div>
    <div class="say"><p><span id="dlgText"></span><span class="end" id="dlgEnd" aria-hidden="true" hidden></span></p></div>
    <div class="choices" id="dlgChoices"></div>
  </section>

  <!-- bản đồ truyền tống (R-HANH-2), canvas BanDo-doc / BanDo-ngang: cuộn vẽ trong cảnh 3D, đây là lớp HUD -->
  <div id="mapHud" hidden>
    <div class="frost" id="mapHint">Chạm một nơi để truyền tống</div>
    <div class="map-card" id="mapCard" role="status" hidden>
      <span class="lock" aria-hidden="true"></span>
      <div><div class="l1" id="mapCardTitle"></div><div class="l2" id="mapCardSub"></div></div>
    </div>
    <button id="mapClose" type="button"><span class="x" aria-hidden="true">×</span>Đóng bản đồ</button>
  </div>

  <!-- bảng nhiệm vụ hằng ngày 日課榜 (R-NV-3) khi không có màn Flutter; canvas NhiemVu-doc / NhiemVu-ngang; nội dung do JS dựng -->
  <div id="daily" role="dialog" aria-label="Bảng nhiệm vụ hằng ngày" hidden>
    <div class="dl-wrap">
      <div class="dl-eyebrow">Khởi Nguyên Trấn · cổng nam</div>
      <main class="dl-card" id="dailyCard"></main>
      <button id="dailyClose" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>Đóng<span class="more"> bảng</span></span></button>
    </div>
  </div>

  <!-- Mốc 1 còn giữ bảng bài học HTML; mốc 3 thay bằng màn Flutter -->
  <div id="lesson" hidden>
    <div class="board">
      <div class="big" id="lsHan"></div>
      <div class="py" id="lsPy"></div>
      <p id="lsMean"></p>
      <dl id="lsInfo"></dl>
      <button id="lsClose" type="button">Ra sân</button>
    </div>
  </div>

  <!-- màn tải (R-MAN-2), canvas ManTai-doc / ManTai-ngang; chữ do JS điền từ đặc tả cảnh -->
  <div id="loading">
    <svg class="mt-doc" aria-hidden="true" viewBox="0 0 390 300" preserveAspectRatio="none">
      <path d="M0 150 L40 110 L78 132 L130 70 L170 112 L205 92 L250 128 L300 64 L350 118 L390 96 L390 300 L0 300 Z" fill="#D3DDDA"/>
      <path d="M0 210 L50 172 L96 196 L150 150 L200 190 L240 168 L292 206 L340 176 L390 200 L390 300 L0 300 Z" fill="#BFCFCB"/>
      <path d="M0 262 C 60 244, 120 270, 190 252 S 320 240, 390 258 L390 300 L0 300 Z" fill="#F4F7F6"/>
    </svg>
    <svg class="mt-ngang" aria-hidden="true" viewBox="0 0 844 170" preserveAspectRatio="none">
      <path d="M0 80 L70 50 L140 70 L230 20 L300 58 L370 40 L450 72 L540 16 L620 60 L700 36 L780 62 L844 44 L844 170 L0 170 Z" fill="#D3DDDA"/>
      <path d="M0 120 L90 92 L170 112 L260 80 L350 110 L430 94 L520 120 L610 96 L700 116 L780 100 L844 112 L844 170 L0 170 Z" fill="#BFCFCB"/>
      <path d="M0 150 C 120 136, 240 158, 380 144 S 640 132, 844 148 L844 170 L0 170 Z" fill="#F4F7F6"/>
    </svg>
    <main>
      <div class="han" id="loadHan" lang="zh"></div>
      <div class="rule" aria-hidden="true"><span class="dot"></span></div>
      <h1 id="loadName"></h1>
      <div class="progress" id="loadBar" role="progressbar" aria-label="Đang tải cảnh" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar"><div class="fill" id="loadFill"></div></div>
        <div class="status" id="loadStatus"></div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
