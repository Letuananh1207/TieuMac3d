<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tiểu Mặc 3D — học chữ Hán trong không gian 3D">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tiểu Mặc 3D">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tiểu Mặc 3D</title>
  <link rel="manifest" href="manifest.json">
  <!-- con trỏ chuột hoạt hình (người dùng 2026-11-14), cùng ảnh với web/src/cursor/: Flutter đặt cursor inline,
       !important thắng; chỗ Flutter báo "pointer" (nút bấm được) → mũi tên vàng -->
  <style>
    *, *::before, *::after { cursor: url("cursor/tro.svg") 5 4, default !important; }
    [style*="cursor: pointer"], [style*="cursor: pointer"] * { cursor: url("cursor/tro-nut.svg") 5 4, pointer !important; }
  </style>
</head>
<body style="background:#141b2c">
  <!-- flutter_inappwebview trên web: WebView là iframe, cần script hỗ trợ của gói (gọi JS trong iframe, sự kiện tải trang) -->
  <script type="application/javascript" src="assets/packages/flutter_inappwebview_web/assets/web/web_support.js" defer></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
